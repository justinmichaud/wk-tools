# Subtests an engine cannot run, by plan and the measured process's word size.
#
# One arm that cannot run a subtest disqualifies it for both: an A/B compares
# two arms over the same set or it compares nothing. `wk pi bench` applies a
# row when either arm's image declares that width, and records what it dropped.
#
# 32-bit: JSC disables wasm SIMD below 64-bit outright --
# Source/JavaScriptCore/runtime/Options.cpp, `#if !CPU(X86_64) && !CPU(ARM64)`
# also clears useWasmIPInt, useBBQJIT and useConcurrentGC -- so a module built
# with SIMD cannot run there at all. Reasons below are the payload's own build.
#
# <plan> <bits> <subtest> <why>
jetstream3 32 argon2-wasm            built -msimd128 (wasm/argon2/build.sh)
jetstream3 32 dotnet-aot-wasm        wasm-opt --enable-simd (wasm/dotnet/build.sh)
jetstream3 32 dotnet-interp-wasm     wasm-opt --enable-simd (wasm/dotnet/build.sh)
jetstream3 32 transformersjs-bert-wasm  ort-wasm-simd-threaded (transformersjs/build.sh)
