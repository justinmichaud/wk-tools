# wpewebkit-2.46-yocto-rpi5-64
#
# WPEWebKit 2.46 on rpi5 (64-bit), bitbaked from the branch's own Yocto distribution. Hours, not minutes.
#
# Sourced by image_profile_load. Only what is true of *this* configuration: the
# board, the width, the tree it is built from and whatever that combination
# needs that the defaults do not give. Nothing here restates a default.

CFG_PROJECT=WPEWebKit
CFG_RELEASE=2.46
CFG_BRANCH=wpe-2.46
CFG_REMOTE=wpe

IMG_BUILDER=yocto
IMG_MACHINE=rpi5
IMG_ARCH=arm64
IMG_HOSTNAME=raspberrypi5
# Every system returns itself unless it is written as a rescue, which is a
# property of the card rather than of this build (wk sysimage write --rescue):
# a board that stays borrowed until somebody notices is the failure this
# exists for.
IMG_WATCHDOG=900

# --- yocto --------------------------------------------------------------------
# The branch is the version pin, and the only one: Tools/yocto on it names poky,
# meta-openembedded, meta-raspberrypi, meta-webkit, meta-clang and meta-browser by
# commit, so pinning the branch pins the whole distribution -- to the same tree
# the WebKit that runs on the board is built from.
YOC_BRANCH=wpe-2.46
YOC_REMOTE=wpe
YOC_TARGET=rpi5-64bits-mesa
# targets.conf's image_basename for that target, named here as well so a missing
# or renamed section fails with "that target is gone" rather than with bitbake's
# own error four hours in.
YOC_IMAGE=webkit-dev-ci-tools
YOC_RM_WORK=1
# Chromium out. The branch's own local conf adds it to compare WPE against
# Chromium, which is a real reason on a fleet built for comparative benchmarking
# -- and it is by a wide margin the most expensive thing in the build: measured
# here, chromium-ozone-wayland and gn-native were 21 GB of TMPDIR *each*, with
# rust-native, cargo-native, rust-llvm-native and mozjs-115 behind them, and
# roughly half of the 13,379 tasks. `--chromium` puts it back.
YOC_CHROMIUM=0

# --- the cross-target this branch does not have -------------------------------
# wpe-2.46's Tools/yocto has no [rpi5-64bits-mesa] section, and -- measured
# 2026-09-02, which the note this replaces had wrong -- no
# rpi/local-rpi5-64bits-mesa.conf either: it is 404 on wpe-2.46,
# webkitglib/2.46 and webkitglib/2.48, and only webkitglib/2.52 carries both.
# WebKit gained the target after these released.
#
# What is *not* missing is the machine. This branch's manifest pins
# meta-raspberrypi 1918a274, which already ships conf/machine/raspberrypi5.conf,
# so nothing deeper than WebKit's own glue is absent -- which is why this is a
# port at all rather than a refusal.
#
# The glue is derived, not vendored: the build takes this branch's own
# rpi4-64bits-mesa local.conf, changes its one MACHINE line to the machine
# below, and adds a targets.conf section pointing at the result
# (image/yocto/port-target.py). Nothing here is a copy of a 200-line local.conf
# that could drift from the branch's own.
#
# Upstreaming the section is still the real answer, and this does not pretend
# otherwise: a build that ports a target says so on every run.
YOC_PORT_TARGET_FROM=rpi4-64bits-mesa
YOC_MACHINE=raspberrypi5
