# wpewebkit-2.46-yocto-rpi5-64 -- WPEWebKit 2.46 on rpi5 (64-bit), bitbaked from the branch's own Yocto distribution. Hours, not minutes. wpe-2.46 ships no rpi5-64bits-mesa section or local conf, so the target is derived from rpi4-64bits-mesa (image/yocto/port-target.py); its meta-raspberrypi pin already has the machine.
CFG_PROJECT=WPEWebKit
CFG_RELEASE=2.46
CFG_BRANCH=wpe-2.46
CFG_REMOTE=wpe

IMG_BUILDER=yocto
IMG_MACHINE=rpi5
IMG_ARCH=arm64
IMG_HOSTNAME=raspberrypi5
YOC_BRANCH=wpe-2.46
YOC_REMOTE=wpe
YOC_TARGET=rpi5-64bits-mesa
YOC_IMAGE=webkit-dev-ci-tools
YOC_RM_WORK=1
YOC_CHROMIUM=0

YOC_PORT_TARGET_FROM=rpi4-64bits-mesa
YOC_MACHINE=raspberrypi5
