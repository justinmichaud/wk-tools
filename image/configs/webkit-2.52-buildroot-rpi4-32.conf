# webkit-2.52-buildroot-rpi4-32 -- WebKit 2.52 on rpi4 (32-bit), built with buildroot: BusyBox init, cog on weston, no service manager.
CFG_PROJECT=WebKit
CFG_RELEASE=2.52
CFG_BRANCH=webkitglib/2.52
CFG_REMOTE=origin

IMG_BUILDER=buildroot
IMG_MACHINE=rpi4
IMG_ARCH=armhf
IMG_HOSTNAME=raspberrypi4
BR_TREE_URL=https://github.com/WebPlatformForEmbedded/buildroot.git
BR_TREE_BRANCH=wpe
BR_TREE_COMMIT=d8ce43b0e3c4a4739e96a84b4e6b7da8185e133a
BR_DEFCONFIG=

BR_OVERLAY_TAILSCALE=arm
BR_EXTERNAL=1
BR_IMAGE=sdcard.img

CFG_NEEDS="no buildroot defconfig tracks a WebKit/WebKit branch. The fork's
    release-pinned family is raspberrypi3_wpe_2_{22,28,38,42,46,50}_cog
    plus raspberrypi3_wpe_next_cog, all of which pin WPEWebKit. A 2.52
    config needs cog and wpewebkit repointed at WebKit/WebKit's
    webkitglib/2.52, in image/buildroot/external."
