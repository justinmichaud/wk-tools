# webkit-2.52-yocto-rpi5-64
#
# WebKit 2.52 on rpi5 (64-bit), bitbaked from the branch's own Yocto distribution. Hours, not minutes.
#
# Sourced by image_profile_load. Only what is true of *this* configuration: the
# board, the width, the tree it is built from and whatever that combination
# needs that the defaults do not give. Nothing here restates a default.

CFG_PROJECT=WebKit
CFG_RELEASE=2.52
CFG_BRANCH=webkitglib/2.52
CFG_REMOTE=origin

IMG_BUILDER=yocto
IMG_MACHINE=rpi5
IMG_ARCH=arm64
IMG_HOSTNAME=raspberrypi5
# --- yocto --------------------------------------------------------------------
# The branch is the version pin, and the only one: Tools/yocto on it names poky,
# meta-openembedded, meta-raspberrypi, meta-webkit, meta-clang and meta-browser by
# commit, so pinning the branch pins the whole distribution -- to the same tree
# the WebKit that runs on the board is built from.
YOC_BRANCH=webkitglib/2.52
YOC_REMOTE=origin
YOC_TARGET=rpi5-64bits-mesa
# targets.conf's image_basename for that target, named here as well so a missing
# or renamed section fails with "that target is gone" rather than with bitbake's
# own error four hours in.
YOC_IMAGE=webkit-dev-ci-tools
YOC_RM_WORK=1
# Chromium out. The branch's own local conf adds it to compare WPE against
# Chromium, which is a real reason on a fleet built for comparative benchmarking
# -- and it is by a wide margin the most expensive thing in the build: measured
# here, chromium-ozone-wayland and gn-native were 21 GB of TMPDIR *each*, with
# rust-native, cargo-native, rust-llvm-native and mozjs-115 behind them, and
# roughly half of the 13,379 tasks. `--chromium` puts it back.
YOC_CHROMIUM=0
