# wpewebkit-2.38-buildroot-rpi3-32
#
# WPEWebKit 2.38 on rpi3 (32-bit), built with buildroot: BusyBox init, cog on weston, no service manager.
#
# Sourced by image_profile_load. Only what is true of *this* configuration: the
# board, the width, the tree it is built from and whatever that combination
# needs that the defaults do not give. Nothing here restates a default.

# 2.38 is buildroot-only. There is no yocto configuration at this release and
# there will not be one: the WPE 2.38 spec is the fork's release-pinned `cog`
# defconfig, and Tools/yocto on a 2.38 branch has no target section to build
# from. A yocto image at this release would be a different distribution wearing
# the release's name.
CFG_PROJECT=WPEWebKit
CFG_RELEASE=2.38
CFG_BRANCH=wpe-2.38
CFG_REMOTE=wpe

IMG_BUILDER=buildroot
IMG_MACHINE=rpi3
IMG_ARCH=armhf
IMG_HOSTNAME=raspberrypi3
# --- buildroot ----------------------------------------------------------------
# The tree is a *fork* pinned to WPE releases, not upstream buildroot, and it is
# where the release-pinned `cog` defconfigs live.
BR_TREE_URL=https://github.com/WebPlatformForEmbedded/buildroot.git
BR_TREE_BRANCH=wpe
# A commit on that branch, and it has to be a commit rather than the `2020.02`
# tag that used to be here. That tag is the *buildroot version* the branch is
# based on, not a place the tree can be stood at: the release-pinned cog
# defconfigs were added to the branch afterwards, so checking the tag out throws
# away the very configuration this profile names. Measured -- the defconfig is
# present on `wpe` and Not Found at `2020.02`, and a build pinned to the tag died
# at `No rule to make target`.
#
# A branch is not a pin either, which is why this is neither. Bump it
# deliberately; the fork is somebody else's vendor branch and moves without
# reference to us.
BR_TREE_COMMIT=d8ce43b0e3c4a4739e96a84b4e6b7da8185e133a
BR_DEFCONFIG=raspberrypi3_wpe_2_38_cog_defconfig

# The tailnet overlay, which is how a buildroot image gets onto the tailnet at
# all: BR2_ROOTFS_OVERLAY, assembled by image/buildroot/tailnet-overlay.sh. The
# tailscale binaries are pinned in one file for all three installers
# (image/yocto/meta-wk-tailnet/.../tailscale-release.inc); the overlay carries no
# credential -- the key arrives with the card.
BR_OVERLAY_TAILSCALE=arm
# A BR2_EXTERNAL tree this repository owns, rather than a patch against somebody
# else's vendor branch. It exists for one reason so far: host-python-2.7's
# bundled 2013-era libffi cannot assemble aarch64/sysv.S, so the build dies at
# `sharedmods` on an arm64 build host. Buildroot ships host-libffi and gives the
# *target* python --with-system-ffi, and simply never joins the two for the host.
BR_EXTERNAL=1
# This defconfig's filesystem output is tar-only -- it builds no rootfs.ext4, so
# the board's own genimage config has nothing to assemble. The image wk writes is
# the one genimage produces.
BR_IMAGE=sdcard.img
