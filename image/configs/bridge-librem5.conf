# bridge-librem5 -- postmarketOS for the Librem 5, as tailnet-bridge-moose-bmc, built like bridge-pinephone. Its u-boot is embedded in the card by pmbootstrap (deviceinfo_sd_embed_firmware), so the card boots without touching the eMMC install.
IMG_BUILDER=pmos
IMG_MACHINE=""
IMG_ARCH=aarch64
IMG_HOSTNAME=tailnet-bridge-moose-bmc

PMO_DEVICE=purism-librem5
PMO_BRIDGE=tailnet-bridge-moose-bmc
PMO_UI=phosh
PMO_CHANNEL=v25.12
PMO_PMB_VERSION=3.9.0
PMO_USER=user
PMO_PASSWORD=147147
PMO_PACKAGES="openssh,nftables,dnsmasq,chrony,tailscale,jq,iw,ethtool,logrotate,zram-init,v4l-utils,networkmanager,avahi,nmap,ffmpeg"
PMO_EXTRA_SPACE=512
PMO_BUILD_HOST=rpi5
PMO_WIFI_BANDS="2.4 5"
PMO_KERNEL_APORT=""
PMO_KCONFIG=""
