# wpewebkit-2.46-yocto-rpi5-32
#
# WPEWebKit 2.46 on rpi5, 32-bit userspace, bitbaked from the branch's own Yocto distribution. Hours, not minutes.
#
# Sourced by image_profile_load. Only what is true of *this* configuration: the
# board, the width, the tree it is built from and whatever that combination
# needs that the defaults do not give. Nothing here restates a default.

CFG_PROJECT=WPEWebKit
CFG_RELEASE=2.46
CFG_BRANCH=wpe-2.46
CFG_REMOTE=wpe

IMG_BUILDER=yocto
IMG_MACHINE=rpi5
IMG_ARCH=armhf
IMG_HOSTNAME=raspberrypi5

# --- yocto --------------------------------------------------------------------
# The branch is the version pin, and the only one: Tools/yocto on it names poky,
# meta-openembedded, meta-raspberrypi, meta-webkit, meta-clang and meta-browser by
# commit, so pinning the branch pins the whole distribution -- to the same tree
# the WebKit that runs on the board is built from.
YOC_BRANCH=wpe-2.46
YOC_REMOTE=wpe
YOC_TARGET=rpi5-32bits-mesa
YOC_IMAGE=lib32-webkit-dev-ci-tools
YOC_RM_WORK=1
YOC_CHROMIUM=0

# --- 32-bit userspace on a 64-bit kernel --------------------------------------
# The Pi 5's Cortex-A76 implements AArch32 at EL0 -- the kernel detects it and
# says so ("CPU features: detected: 32-bit EL0 Support") -- so a 32-bit
# userspace runs here. A 32-bit *kernel* does not exist for the machine and is
# not wanted: at the pinned rev the rpi kernel builds no bcm2712 device tree
# under arch/arm and carries no 32-bit bcm2712 defconfig.
#
# So the machine stays the 64-bit one, which keeps the kernel, the device tree
# and the firmware exactly as the rpi5-64 configuration builds them, and the
# userspace comes from poky's own multilib: every recipe gains a lib32 variant,
# and meta-wk-multilib maps the image's install list onto them. The comparison
# against wpewebkit-2.46-yocto-rpi5-64 is then a difference of userspace width
# and nothing else.
YOC_MULTILIB=lib32
# The A76 in AArch32 is an ARMv8-A 32-bit core: armv7ve (virtualization
# extensions, LPAE), Thumb-2, hard float, NEON and VFPv4. poky offers no
# aarch32 tune for the A76 itself -- its armv8a tunes are all aarch64 -- and
# this is the closest one it has.
YOC_MULTILIB_TUNE=armv7vethf-neon-vfpv4

# --- the cross-target this branch does not have -------------------------------
# wpe-2.46's Tools/yocto has no rpi5 section at all (see
# wpewebkit-2.46-yocto-rpi5-64.conf, which states the case and the evidence).
# The 32-bit one is derived the same way and additionally names the multilib
# image recipe as the target's own, so the helper builds that rather than the
# 64-bit image of the same name.
YOC_PORT_TARGET_FROM=rpi4-64bits-mesa
YOC_MACHINE=raspberrypi5
