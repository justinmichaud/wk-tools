# bridge-pinephone -- postmarketOS for the PinePhone, as tailnet-bridge-generic: pmbootstrap on a Linux aarch64 machine, ssh key and WiFi baked in, the bridge role's packages preinstalled. Goes on a microSD, which both phones boot in preference to their own storage.
IMG_BUILDER=pmos
IMG_MACHINE=""
IMG_ARCH=aarch64
IMG_HOSTNAME=tailnet-bridge-generic

PMO_DEVICE=pine64-pinephone
PMO_BRIDGE=tailnet-bridge-generic
PMO_UI=phosh
PMO_CHANNEL=v25.12
PMO_PMB_VERSION=3.9.0
PMO_USER=user
PMO_PASSWORD=147147
PMO_PACKAGES="openssh,nftables,dnsmasq,chrony,tailscale,jq,iw,ethtool,logrotate,zram-init,v4l-utils,networkmanager,avahi,nmap"
PMO_EXTRA_SPACE=512
PMO_BUILD_HOST=rpi5
PMO_WIFI_BANDS="2.4"
PMO_KERNEL_APORT=device/community/linux-postmarketos-allwinner
PMO_KCONFIG="CONFIG_SUNXI_WATCHDOG=m"
