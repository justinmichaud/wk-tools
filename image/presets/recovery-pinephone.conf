# recovery-pinephone -- Jumpdrive, the PinePhone's service image, downloaded and pinned rather than built. Boots from a card and exports the phone's internal storage over USB, which is how its eMMC gets written, and settles whether a card that does not boot is a bad image or a phone that will not boot cards.
