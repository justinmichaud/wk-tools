# wpewebkit-2.38-buildroot-rpi3-32 -- WPEWebKit 2.38 on rpi3 (32-bit), built with buildroot: BusyBox init, cog on weston, no service manager. 2.38 is buildroot-only: the release's spec is the fork's release-pinned cog defconfig, and Tools/yocto on a 2.38 branch has no target section.
CFG_PROJECT=WPEWebKit
CFG_RELEASE=2.38
CFG_BRANCH=wpe-2.38
CFG_REMOTE=wpe

IMG_BUILDER=buildroot
IMG_MACHINE=rpi3
IMG_ARCH=armhf
IMG_HOSTNAME=raspberrypi3
BR_TREE_URL=https://github.com/WebPlatformForEmbedded/buildroot.git
BR_TREE_BRANCH=wpe
BR_TREE_COMMIT=d8ce43b0e3c4a4739e96a84b4e6b7da8185e133a
BR_DEFCONFIG=raspberrypi3_wpe_2_38_cog_defconfig

BR_OVERLAY_TAILSCALE=arm
BR_EXTERNAL=1
BR_IMAGE=sdcard.img
