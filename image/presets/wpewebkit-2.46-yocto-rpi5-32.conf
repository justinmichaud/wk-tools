# wpewebkit-2.46-yocto-rpi5-32 -- WPEWebKit 2.46 on rpi5, 32-bit userspace, bitbaked from the branch's own Yocto distribution. Hours, not minutes. 32-bit userspace on the 64-bit machine, because no 32-bit bcm2712 kernel exists (no arch/arm device tree, no defconfig at the pinned rev) while the A76 does implement AArch32 at EL0. poky has no aarch32 A76 tune; armv7vethf-neon-vfpv4 is its closest.
CFG_PROJECT=WPEWebKit
CFG_RELEASE=2.46
CFG_BRANCH=wpe-2.46
CFG_REMOTE=wpe

IMG_BUILDER=yocto
IMG_MACHINE=rpi5
IMG_ARCH=armhf
IMG_HOSTNAME=raspberrypi5
YOC_BRANCH=wpe-2.46
YOC_REMOTE=wpe
YOC_TARGET=rpi5-32bits-mesa
YOC_IMAGE=lib32-webkit-dev-ci-tools
YOC_RM_WORK=1
YOC_CHROMIUM=0

YOC_MULTILIB=lib32
YOC_MULTILIB_TUNE=armv7vethf-neon-vfpv4

YOC_PORT_TARGET_FROM=rpi4-64bits-mesa
YOC_MACHINE=raspberrypi5
