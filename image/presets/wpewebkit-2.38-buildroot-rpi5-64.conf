# wpewebkit-2.38-buildroot-rpi5-64 -- WPEWebKit 2.38 on rpi5 (64-bit), built with buildroot: BusyBox init, cog on weston, no service manager. 2.38 is buildroot-only: the release's spec is the fork's release-pinned cog defconfig, and Tools/yocto on a 2.38 branch has no target section.
CFG_PROJECT=WPEWebKit
CFG_RELEASE=2.38
CFG_BRANCH=wpe-2.38
CFG_REMOTE=wpe

IMG_BUILDER=buildroot
IMG_MACHINE=rpi5
IMG_ARCH=arm64
IMG_HOSTNAME=raspberrypi5
BR_TREE_URL=https://github.com/WebPlatformForEmbedded/buildroot.git
BR_TREE_BRANCH=wpe
BR_TREE_COMMIT=d8ce43b0e3c4a4739e96a84b4e6b7da8185e133a
BR_DEFCONFIG=

BR_OVERLAY_TAILSCALE=arm64
BR_EXTERNAL=1
BR_IMAGE=sdcard.img

CFG_NEEDS="no defconfig for rpi5 at 64-bit. The fork ships raspberrypi3_wpe_2_38_cog_defconfig
    (rpi3, 32-bit) and nothing release-pinned for any other board: the
    raspberrypi4_* defconfigs are _ml_/_weston_/_wst_, on cortex-a72 and a
    pinned bcm2711 kernel tarball rather than rpi-5.15.y, and none of them
    pins a WPE release. Derive one in image/buildroot/external."
