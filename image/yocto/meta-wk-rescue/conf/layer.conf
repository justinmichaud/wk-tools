# Installs admin/wk-card-priv on the board so its rescue can write and arm the bench medium.

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-wk-rescue"
BBFILE_PATTERN_meta-wk-rescue = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-wk-rescue = "10"

LAYERDEPENDS_meta-wk-rescue = "core"
LAYERSERIES_COMPAT_meta-wk-rescue = "scarthgap"
