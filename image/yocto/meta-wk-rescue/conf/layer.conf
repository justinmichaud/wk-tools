# A layer that changes what is *on the board*, next to meta-wk-tailnet and
# meta-wk-wifi for the same reason: a recipe here changes image content on
# purpose, kept visible as its own line in bblayers.conf.
#
# What it adds is the one privileged helper every card edit goes through,
# admin/wk-card-priv, so a system written by wk can be a *rescue*: the board's
# own rescue writes the bench system onto the other medium and arms it, with
# nobody carrying cards (README.md, "rescue"). The helper is installed from
# the repository's own copy (FILESEXTRAPATHS in the recipe), never a second
# copy kept here.
#
# Added to bblayers.conf by image/yocto-build.sh, like meta-wk-tailnet.

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-wk-rescue"
BBFILE_PATTERN_meta-wk-rescue = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-wk-rescue = "10"

LAYERDEPENDS_meta-wk-rescue = "core"
LAYERSERIES_COMPAT_meta-wk-rescue = "scarthgap"
