# A layer that changes what is *on the board* -- deliberately, and alone in that.
#
# `meta-wk` next door exists for build-time fixes and says in as many words that
# a recipe in it must never change image content, because that would make "the
# 2.48 image" mean something else. That rule stands. This is the second layer
# rather than a second opinion about the first: it changes image content, it is
# meant to, and keeping it separate is what makes the change visible to anybody
# reading bblayers.conf instead of buried among build fixes.
#
# What it adds is tailscale, and the reason is the fleet's rule rather than
# anything about WebKit: everything wk touches is on the tailnet, and a node is
# reached by its tailnet name with nothing about how to reach it written down
# (CLAUDE.md, "Cattle, not pets"). Without this the boards are the exception --
# `raspberrypi3.local` for one, a bridge-segment address behind a ProxyJump for
# the other, an ARP-table lookup for either in bench mode -- and every one of
# those is a fact that goes stale in the way that reads as broken hardware.
#
# What it costs, stated rather than discovered later: an image built with this
# layer runs tailscaled while the board is being measured. That is a daemon, a
# wakeup timer and a few tens of MB of RSS on a 931 MB rpi3 with no swap, so a
# number from an image that carries it is comparable with another image that
# carries it, and not with the 2.46 numbers taken before it existed. The image
# id in the manifest is what tells those apart, which is why the id is recorded
# per run and not per profile.
#
# The recipe installs upstream's own static build rather than compiling
# tailscale from source. That is not laziness about reproducibility -- the
# tarball is pinned by version and sha256 in recipes-network/tailscale, which is
# a stronger pin than a git revision plus a Go module cache would be here -- it
# is that a Go build of tailscale inside this image's cross environment is a
# large dependency (meta-virtualization or a vendored module cache) for a binary
# upstream already publishes as pure-Go and static, with a 32-bit ARM build for
# the one board that needs it. `wk pi setup` installs exactly the same bytes on
# a board that is already running; the pin lives in one file so the two cannot
# drift.
#
# Added to bblayers.conf by image/yocto-build.sh, like meta-wk, rather than by
# editing the release branch's own rpi/bblayers.conf template.

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-wk-tailnet"
BBFILE_PATTERN_meta-wk-tailnet = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-wk-tailnet = "10"

LAYERDEPENDS_meta-wk-tailnet = "core"
LAYERSERIES_COMPAT_meta-wk-tailnet = "scarthgap"
