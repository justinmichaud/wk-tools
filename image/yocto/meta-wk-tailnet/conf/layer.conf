# Changes image content on purpose: installs upstream's pinned static tailscale build (recipes-network/tailscale, the same bytes wk pi setup uses), so an image carrying this layer runs tailscaled while the board is measured and its numbers compare only with others that do.

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-wk-tailnet"
BBFILE_PATTERN_meta-wk-tailnet = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-wk-tailnet = "10"

LAYERDEPENDS_meta-wk-tailnet = "core"
LAYERSERIES_COMPAT_meta-wk-tailnet = "scarthgap"
