# A layer of wk's own, for local fixes to the *build* -- never to the image.
#
# The distribution being built is pinned by the WebKit release branch's
# Tools/yocto/rpi/manifest.xml, which names poky, meta-openembedded,
# meta-raspberrypi, meta-webkit, meta-clang and meta-browser by commit. That pin
# is the whole point of an `rpi4-wpe-2.48` profile, so nothing here may change
# what ends up on the board.
#
# What it is for is the other half: host tools that only exist during the build.
# Those are not part of the distribution, and when one of them does not work on
# the machine doing the building, fixing it here changes no image content at
# all. Today that is exactly one recipe -- see recipes-devtools/pseudo.
#
# The rule to keep, then: a recipe in this layer must be build-time only. A
# change to anything installed into the image belongs upstream, or in a
# different profile, because it makes "the 2.48 image" mean something else.
#
# Added to bblayers.conf by image/yocto-build.sh rather than by editing the
# branch's own rpi/bblayers.conf template -- the same reasoning as the
# local.conf additions, and the same pattern the wiki's custom-kernel flow uses
# with a local meta-webkit checkout.

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-wk"
BBFILE_PATTERN_meta-wk = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-wk = "10"

LAYERDEPENDS_meta-wk = "core"
LAYERSERIES_COMPAT_meta-wk = "scarthgap"
