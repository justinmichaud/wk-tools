# A layer that changes what is *on the board* -- meta-wk-tailnet's shape,
# next to it, for the same reason: a recipe here changes image content on
# purpose, and keeping that in its own layer is what makes the change visible
# to anybody reading bblayers.conf instead of buried among build fixes.
#
# What it adds is a way to bring up WiFi from a credential seeded onto the
# card, and the reason is a hardware fact about this fleet rather than
# anything about WebKit: rpi3, rpi4 and rpi5 -- every board `wk sysimage`
# builds for -- sit on the bench with no cable. Without this the boards this
# layer targets have no network at all once written, which is worse than the
# thing meta-wk-tailnet exists to end (CLAUDE.md, "Cattle, not pets": a board
# nobody can reach is not cattle, it is a brick).
#
# wpa_supplicant itself is oe-core's own recipe (recipes-connectivity), pulled
# in as an RDEPENDS of the join package rather than duplicated here -- this
# layer supplies the two things oe-core does not: a place for the credential
# to land (wk sysimage write seeds it, never this layer -- an image is stored,
# copied and kept after it is superseded, and a credential inside one is a
# credential in every copy) and the script that spends it every boot.
#
# Persistent rather than spent-once like the tailnet key: WiFi association is
# not "joined forever" the way a tagged tailnet node is -- the radio has to
# re-associate on every boot, so the seeded credential stays on the card for
# the card's whole life, the same way the driving ssh key does.
#
# Ethernet is untouched: this only ever adds wlan0 alongside whatever eth0
# already does, so a board with a cable plugged in keeps using it.
#
# Added to bblayers.conf by image/yocto-build.sh, like meta-wk-tailnet.

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-wk-wifi"
BBFILE_PATTERN_meta-wk-wifi = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-wk-wifi = "10"

LAYERDEPENDS_meta-wk-wifi = "core"
LAYERSERIES_COMPAT_meta-wk-wifi = "scarthgap"
