# Changes image content on purpose: rpi3/rpi4/rpi5 sit on the bench with no cable, so wpa_supplicant (oe-core's recipe, an RDEPENDS) is driven from a credential wk sysimage write seeds onto the card -- never from this layer, which a stored image would copy.

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-wk-wifi"
BBFILE_PATTERN_meta-wk-wifi = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-wk-wifi = "10"

LAYERDEPENDS_meta-wk-wifi = "core"
LAYERSERIES_COMPAT_meta-wk-wifi = "scarthgap"
