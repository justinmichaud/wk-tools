# The layer that makes a multilib image's install list name multilib packages.
#
# Separate from meta-wk because that layer is build-time only by rule (its
# conf/layer.conf states it): this one changes what lands in the image, so it
# is its own layer and image/yocto-build.sh adds it only for a profile that
# asks for multilib. An image built without one is untouched by this.

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-wk-multilib"
BBFILE_PATTERN_meta-wk-multilib = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-wk-multilib = "10"

LAYERDEPENDS_meta-wk-multilib = "core"
LAYERSERIES_COMPAT_meta-wk-multilib = "scarthgap"
