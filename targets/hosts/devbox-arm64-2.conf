# devbox-arm64-2 -- an Igalia shared build machine: Debian 12, aarch64, 80
# cores. The ssh entry of that name points at bbox-12-arm64 through
# igalia.com. Provisioned by `wk remote setup devbox-arm64-2`.

WK_TARGET_KIND=remote
WK_REMOTE_HOST=""
WK_REMOTE_ROOT=""
WK_REMOTE_REFERENCE=""
WK_REMOTE_LOCAL=""
WK_REMOTE_PEER=""
WK_REMOTE_TOOLS=""
# Nothing to override: clang 18 builds the tree as the configs expect, so
# this file exists to make the machine a target on every device rather than
# to change anything about it. That is the normal case for a registry entry.
WK_TARGET_CMAKE=""
# 1 to also run Tools/wpe/install-dependencies during `wk remote setup`.
WK_TARGET_WPE=""
WK_BUILD_ARGS=""
