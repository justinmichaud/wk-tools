# devbox-arm64-2 -- an Igalia shared build machine: Debian 12, aarch64, 80
# cores. The ssh entry of that name points at bbox-12-arm64 through igalia.com.
# Provisioned by `wk remote setup devbox-arm64-2`.
#
# Nothing to override: clang 18 builds the tree as the configs expect, so this
# file exists to make the machine a target on every device rather than to
# change anything about it. That is the normal case for a registry entry.
#
# No WK_TARGET_CMAKE, and no job ceiling either -- it had one (16, on a box
# with 250 GB and 80 cores) and a fixed number is exactly what this repo's
# resource policy says not to have.
