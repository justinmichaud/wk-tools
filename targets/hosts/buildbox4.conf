# buildbox4 -- an Igalia shared build machine: Debian 13, aarch64, 128 cores.
# Reached through the ssh entry of the same name, which jumps through
# igalia.com. Provisioned by `wk remote setup buildbox4`.
#
# In the registry rather than in ~/.config/wk/targets because none of it is a
# fact about the device doing the driving. It is what buildbox4 *is*, and a
# second device that builds here needs exactly the same answers.

# The three flags every build on this machine needs, added to whatever the
# config already sets (build/configs.sh assembles them; --cmake on the command
# line is appended after these, so a one-off still wins).
#
# All three are downstream of one property: buildbox4 is the only machine here
# on clang 19 (19.1.7; devbox-arm64-2 is on 18.1.8 and moose on 18.1.3), and
# WebKit's tree is not clean under it.
#
#   DEVELOPER_MODE_FATAL_WARNINGS=OFF
#       every config here builds with DEVELOPER_MODE=ON, which makes warnings
#       fatal. clang 19 warns about code clang 18 accepts, so the build stops
#       on a warning that is nobody's fault and is not ours to fix.
#   CMAKE_CXX_FLAGS=-Wno-invalid-constexpr
#       clang 19's -Winvalid-constexpr fires in the WebKit tree. Note the
#       shape: -DCMAKE_CXX_FLAGS= *replaces* that variable rather than adding
#       to it, which is safe only because nothing else in this repo sets it --
#       and is a good reason for it to be written down once here instead of
#       being re-typed per build.
#   ENABLE_WK_WEB_EXTENSIONS=OFF
#       does not build here. Found by building, not by reading: what exactly
#       fails is not recorded, and if it is ever fixed this flag is the one to
#       drop first.
WK_TARGET_CMAKE="-DDEVELOPER_MODE_FATAL_WARNINGS=OFF -DCMAKE_CXX_FLAGS=-Wno-invalid-constexpr -DENABLE_WK_WEB_EXTENSIONS=OFF"

# No job ceiling. The count is derived per build from what the machine has free
# at the time (targets/remote.sh), which is the number that decides whether a
# link step survives on a box shared with everyone else at Igalia.
