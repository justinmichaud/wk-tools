# buildbox4 -- Igalia shared build machine, Debian 13 x86_64 128 cores, clang 19: it warns on code clang 18 accepts (DEVELOPER_MODE makes that fatal), -Winvalid-constexpr fires in the tree, web extensions do not build, and no libc++ is installed (apt-get install libc++-19-dev libc++abi-19-dev, then WK_TARGET_LIBCXX=1).
WK_TARGET_KIND=remote
WK_REMOTE_HOST=""
WK_REMOTE_ROOT=""
WK_REMOTE_REFERENCE=""
WK_REMOTE_LOCAL=""
WK_REMOTE_PEER=""
WK_REMOTE_TOOLS=""
WK_TARGET_CMAKE="-DDEVELOPER_MODE_FATAL_WARNINGS=OFF -DCMAKE_CXX_FLAGS=-Wno-invalid-constexpr -DENABLE_WK_WEB_EXTENSIONS=OFF"
WK_TARGET_LIBCXX=0
WK_TARGET_WPE=""
WK_BUILD_ARGS=""
