# buildbox4 -- an Igalia shared build machine: Debian 13, x86_64, 128 cores.
# Reached through the ssh entry of the same name, which jumps through
# igalia.com. Provisioned by `wk remote setup buildbox4`.

WK_TARGET_KIND=remote
WK_REMOTE_HOST=""
WK_REMOTE_ROOT=""
WK_REMOTE_REFERENCE=""
WK_REMOTE_LOCAL=""
WK_REMOTE_PEER=""
WK_REMOTE_TOOLS=""
# Most of this is downstream of one property: buildbox4 is the only machine
# here on clang 19 (19.1.7; devbox-arm64-2 is on 18.1.8 and moose on 18.1.3),
# and WebKit's tree is not clean under it.
#
#   DEVELOPER_MODE_FATAL_WARNINGS=OFF
#       every config here builds with DEVELOPER_MODE=ON, which makes warnings
#       fatal. clang 19 warns about code clang 18 accepts, so the build stops
#       on a warning that is nobody's fault and is not ours to fix.
#   CMAKE_CXX_FLAGS=-Wno-invalid-constexpr
#       clang 19's -Winvalid-constexpr fires in the WebKit tree. Note the
#       shape: -DCMAKE_CXX_FLAGS= *replaces* that variable rather than adding
#       to it, so everything that belongs in it lives in this one value -- a
#       second -DCMAKE_CXX_FLAGS= anywhere would silently drop whichever came
#       first.
#   ENABLE_WK_WEB_EXTENSIONS=OFF
#       does not build here. Found by building, not by reading: what exactly
#       fails is not recorded, and if it is ever fixed this flag is the one to
#       drop first.
#
# Machine-wide rather than per-config (WK_TARGET_CMAKE_<config>, see
# config_target_var in build/configs.sh): both are a property of the toolchain
# on this box, so both are true of every config built here.
#
# Deliberately NOT -stdlib=libc++, and this is measured, not assumed: there is
# no libc++ on this machine at all (`clang++ -stdlib=libc++` cannot find
# <string>), so those flags would stop every build here at the first
# translation unit -- while the tree builds as it stands against the system
# libstdc++. Wanting libc++ here means asking the machine's administrators for
# `libc++-19-dev libc++abi-19-dev` first, and then adding
# -DCMAKE_EXE/SHARED/MODULE_LINKER_FLAGS=-stdlib=libc++ alongside it in
# CMAKE_CXX_FLAGS above -- cmake keeps the three linker variables separately
# and the driver needs the flag at link time too.
WK_TARGET_CMAKE="-DDEVELOPER_MODE_FATAL_WARNINGS=OFF -DCMAKE_CXX_FLAGS=-Wno-invalid-constexpr -DENABLE_WK_WEB_EXTENSIONS=OFF"
# 1 to also run Tools/wpe/install-dependencies during `wk remote setup`.
WK_TARGET_WPE=""
WK_BUILD_ARGS=""
