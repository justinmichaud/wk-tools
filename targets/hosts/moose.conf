# moose -- the Linux workstation: Ubuntu 24.04, 80 cores, reached by name
# over the tailnet (the ssh entry sets only the user; MagicDNS resolves the
# rest).
#
# A *peer*, not a build machine (targets/remote.sh, "peers"): moose owns
# workspaces of its own -- rootless podman containers, its own store, its
# own mirror, its own git checkout of this repository. `wk new --target
# moose` and `wk rm --target moose` are refused, with the command to run on
# moose instead. What this entry buys is `wk status`/`wk ls` on another
# device delegating to moose's own wk and reporting what is building there.

WK_TARGET_KIND=remote
WK_REMOTE_HOST=""
WK_REMOTE_ROOT=""
WK_REMOTE_REFERENCE=""
WK_REMOTE_LOCAL=""
WK_REMOTE_PEER=1
# Relative to the *remote* home (this file is sourced on the driving side, so
# $HOME here would be the wrong machine's).
WK_REMOTE_TOOLS=Development/wk-tools
WK_TARGET_CMAKE=""
WK_TARGET_LIBCXX=1
WK_TARGET_WPE=""
WK_BUILD_ARGS=""
