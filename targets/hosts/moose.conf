# moose -- the Linux workstation: Ubuntu 24.04, 80 cores, reached by name over
# the tailnet (the ssh entry sets only the user; MagicDNS resolves the rest).
#
# A *peer*, not a build machine -- see "peers" in targets/remote.sh. moose owns
# workspaces of its own: rootless podman containers, its own store, its own
# mirror, its own git checkout of this repository. It is not the far end of
# anything, and provisioning it as a build box would have written ~/.wk-remote
# on it and made it refuse `wk sync`, `wk gc` and `wk new` on itself.
#
# What this entry buys, and it is the whole reason it exists: `wk status` and
# `wk ls` on the Mac now delegate to moose's own wk and report what is building
# over there. Before it, a bare `wk status` on the Mac could not say a word
# about the other workstation, because the target list was machine-local and
# moose was in nobody's.
#
# What it does not buy: building here. `wk new --target moose` and
# `wk rm --target moose` are refused, with the command to run on moose instead.
WK_TARGET_KIND=remote
WK_REMOTE_PEER=1

# Relative to the *remote* home (this file is sourced on the driving side, so
# $HOME here would be the wrong machine's).
WK_REMOTE_TOOLS=Development/wk-tools
