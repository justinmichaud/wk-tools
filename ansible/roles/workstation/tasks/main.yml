---
# Where the person sits: Zed with their settings, ssh to every machine, and wk (the wk role, which runs after this one
# and needs git). It holds no workspace and no credential. The person installs Debian and gives the conf's user sudo
# without a password, as an installed server's has; the packages wk needs come from apt. Zed comes from its own
# per-user installer and updates itself after.

- name: Install the packages a workstation needs
  ansible.builtin.apt:
    name: "{{ wk_workstation_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 86400
  become: true

- name: Look for Zed
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/zed"
  register: wk_zed

- name: Install Zed
  when: not wk_zed.stat.exists
  block:
    - name: Fetch Zed's installer
      ansible.builtin.get_url:
        url: "{{ wk_zed_install }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/.cache/zed-install.sh"
        mode: "0644"

    - name: Run it
      ansible.builtin.command:
        argv: [sh, "{{ ansible_facts['env']['HOME'] }}/.cache/zed-install.sh"]
        creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/zed"

- name: Make Zed's config directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/zed"
    state: directory
    mode: "0755"

# Copies, not links into tools/, which every setup checks out again: a setting changed in Zed is kept in this role.
- name: Write Zed's settings and keymap
  ansible.builtin.copy:
    src: "zed/{{ item }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/zed/{{ item }}"
    mode: "0644"
  loop: [settings.json, keymap.json]

- name: Make ~/.ssh
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh"
    state: directory
    mode: "0700"

- name: Write the ssh config of every machine
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh/config"
    block: "{{ lookup('ansible.builtin.template', 'ssh_config.j2') }}"
    marker: "# {mark} wk"
    create: true
    mode: "0600"

- name: Include the person's git settings
  community.general.git_config:
    scope: global
    name: include.path
    value: "{{ wk_home }}/tools/ansible/roles/workstation/files/gitconfig"

# ante's firmware (HP Q07 02.07.00, 2019, on no LVFS) wakes from S3 by its RTC alone: neither a key nor the power button
# brings it back, and it is then frozen. In s2idle Linux handles the wake, and a key wakes it.
- name: Make the systemd sleep drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/sleep.conf.d
    state: directory
    mode: "0755"
  become: true

- name: Sleep in s2idle
  ansible.builtin.copy:
    content: |
      # Written by wk's workstation role: S3 is woken by nothing but the RTC on this firmware.
      [Sleep]
      MemorySleepMode=s2idle
    dest: /etc/systemd/sleep.conf.d/wk.conf
    mode: "0644"
  become: true
