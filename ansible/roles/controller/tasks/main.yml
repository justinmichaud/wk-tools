---
# The controller's own: `wk` in its bin; the pinned websocat an install carries the image to a BMC with; and two
# systemd user units: the injector, the forward proxy that holds the one claude.ai login (lib/wk/creds/injector.py),
# which makes its own CA at its first start, and the API, `wk serve` (lib/wk/api).

- name: Make the controller's bin
  ansible.builtin.file:
    path: "{{ wk_home }}/bin"
    state: directory
    mode: "0755"

- name: Link the checkout that provisions into bin
  ansible.builtin.file:
    src: "{{ wk_root }}/wk"
    dest: "{{ wk_home }}/bin/wk"
    state: link

# A change made here (`wk machine save`'s settings) is pushed from here: git asks this helper for github.com, and it
# answers the stored github-token, read from its file at each push. The checkout's own config, not the login's.
- name: Let the checkout push with the stored GitHub token
  community.general.git_config:
    scope: local
    repo: "{{ wk_root }}"
    name: credential.https://github.com.helper
    value: >-
      !f() { test "$1" = get && printf 'username=x-access-token\npassword=%s\n' "$(cat '{{ wk_store }}/github-token')"; }; f

- name: Assert this platform has a pinned websocat
  ansible.builtin.assert:
    that: wk_websocat_platform in wk_websocat_assets
    fail_msg: >-
      websocat {{ wk_websocat_version }} has no pinned binary for {{ inventory_hostname }} ({{ wk_websocat_platform }}):
      the controller is one of {{ wk_websocat_assets | join(', ') }}
    quiet: true

- name: Make websocat's directory
  ansible.builtin.file:
    path: "{{ wk_websocat | dirname }}"
    state: directory
    mode: "0755"

- name: Fetch the pinned websocat
  ansible.builtin.get_url:
    url: "https://github.com/vi/websocat/releases/download/v{{ wk_websocat_version }}/websocat.{{ wk_websocat_assets[wk_websocat_platform].target }}"
    dest: "{{ wk_websocat }}"
    checksum: "sha256:{{ wk_websocat_assets[wk_websocat_platform].sha256 }}"
    mode: "0755"

- name: Make the injector's directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop: ["{{ wk_injector_dir }}", "{{ wk_injector_dir }}/login"]

- name: Copy the injector
  ansible.builtin.copy:
    src: "{{ wk_root }}/lib/wk/creds/injector.py"
    dest: "{{ wk_injector_dir }}/injector.py"
    mode: "0600"

- name: Ask for the credentials' names
  ansible.builtin.import_role:
    name: credentials
    tasks_from: names

- name: Say why the injector holds no login
  ansible.builtin.debug:
    msg: "the controller holds no claude-login, so the injector holds no login: wk key set claude-login, then this again"
  when: "'claude-login' not in wk_store_names"

# The injector rewrites the login at each refresh, and the stored copy is spent by the first: the login is delivered
# only when the stored one differs from the one delivered last, whose digest the marker keeps.
- name: Deliver the stored claude.ai login
  when: "'claude-login' in wk_store_names"
  no_log: true
  diff: false
  block:
    - name: Compare it with the login delivered last
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.file', wk_store ~ '/claude-login') | hash('sha256') }}"
        dest: "{{ wk_injector_dir }}/login/delivered"
        mode: "0600"
      check_mode: true
      register: wk_login_marker

    - name: Deliver the login
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.file', wk_store ~ '/claude-login') | from_json | to_json }}\n"
        dest: "{{ wk_injector_dir }}/login/.credentials.json"
        mode: "0600"
      when: wk_login_marker is changed

    - name: Record the login delivered
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.file', wk_store ~ '/claude-login') | hash('sha256') }}"
        dest: "{{ wk_injector_dir }}/login/delivered"
        mode: "0600"

- name: Write the units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ wk_unit_dir }}/{{ item }}"
    mode: "0644"
  loop: "{{ wk_units | list }}"

- name: Enable and start the units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    scope: user
    enabled: true
    state: started
    daemon_reload: true
  environment: "{{ wk_user_bus }}"
  loop: "{{ wk_units | list }}"

# A unit is restarted whenever its program or unit file is newer than the running process, which a run killed or failed
# between the copy and the restart also leaves behind. The API's unit names the commit it serves, so a new commit
# rewrites it.
- name: Look at the units' programs and unit files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ wk_units | list | map('regex_replace', '^', wk_unit_dir ~ '/') | list + wk_units.values() | flatten }}"
  register: wk_unit_files

- name: Ask when the units started
  ansible.builtin.command:
    argv: [systemctl, --user, show, "{{ item }}", --property, ActiveEnterTimestamp, --timestamp=unix, --value]
  environment: "{{ wk_user_bus }}"
  loop: "{{ wk_units | list }}"
  register: wk_unit_started
  changed_when: false
  check_mode: false

- name: Restart a unit older than its program or unit file
  ansible.builtin.systemd_service:
    name: "{{ item.item }}"
    scope: user
    state: restarted
    daemon_reload: true
  environment: "{{ wk_user_bus }}"
  loop: "{{ wk_unit_started.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: >-
    (item.stdout | trim | regex_replace('^@', '') | int)
    < (wk_unit_files.results | selectattr('item', 'in', [wk_unit_dir ~ '/' ~ item.item] + wk_units[item.item])
       | map(attribute='stat.mtime', default=0) | max | int)

- name: Wait for the injector's CA
  ansible.builtin.wait_for:
    path: "{{ wk_injector_dir }}/ca.pem"
    timeout: 60
  when: not ansible_check_mode
