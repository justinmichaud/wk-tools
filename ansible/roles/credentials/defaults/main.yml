---
wk_secrets: "{{ wk_home }}/secrets"
wk_delivered: [github-user, github-token, bugzilla-user, bugzilla-password, litellm-key]
wk_bugzilla_host: "{{ wk_project.bugzilla | urlsplit('hostname') | upper | replace('.', '_') }}"
# What git-webkit (webkitcorepy.credentials: <HOST>_USERNAME and <HOST>_TOKEN or _PASSWORD) and gh read.
wk_env_names:
  - [GITHUB_COM_USERNAME, github-user]
  - [GITHUB_COM_TOKEN, github-token]
  - [GH_TOKEN, github-token]
  - ["{{ wk_bugzilla_host }}_USERNAME", bugzilla-user]
  - ["{{ wk_bugzilla_host }}_PASSWORD", bugzilla-password]
wk_deploy_repos: >-
  {{ wk_store_names | select('match', '^deploy-key/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$')
     | map('regex_replace', '^deploy-key/', '') | list }}
wk_rc: "{{ '.zshrc' if 'mac' in group_names else '.bashrc' }}"
