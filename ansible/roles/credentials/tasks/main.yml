---
# Delivery: every secret lands under <wk_home>/secrets (0700). Outside it go only what an agent session needs: the
# injector's CA, the placeholder login, and pi's models.json. Values are read on the client and travel inside the module's arguments: never argv, a log or a diff.

- name: Ask the store for its names
  ansible.builtin.import_tasks: names.yml

- name: Name what the store lacks
  ansible.builtin.debug:
    msg: "{{ item }} is not in the store, so it is not delivered: wk key set {{ item }}"
  loop: "{{ wk_delivered | difference(wk_store_names) }}"

- name: Make the secrets' directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop: ["{{ wk_secrets }}", "{{ wk_secrets }}/deploy"]

- name: Deliver each repository's deploy key
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.pipe', wk_bao_get ~ (('deploy-key/' ~ item) | quote)) }}\n"
    dest: "{{ wk_secrets }}/deploy/{{ item | replace('/', '--') }}"
    mode: "0600"
  loop: "{{ wk_deploy_repos }}"
  no_log: true
  diff: false

- name: Write the ssh aliases that select a deploy key
  ansible.builtin.template:
    src: ssh_config.j2
    dest: "{{ wk_secrets }}/ssh_config"
    mode: "0600"

- name: Write env.sh
  ansible.builtin.template:
    src: env.sh.j2
    dest: "{{ wk_secrets }}/env.sh"
    mode: "0600"
  no_log: true
  diff: false

- name: Make ssh's directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh"
    state: directory
    mode: "0700"

- name: Make ssh read the aliases
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh/config"
    line: "Include {{ wk_secrets }}/ssh_config"
    insertbefore: BOF
    create: true
    mode: "0600"

- name: Make an interactive shell source env.sh
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/{{ wk_rc }}"
    line: "[ -r {{ wk_secrets }}/env.sh ] && . {{ wk_secrets }}/env.sh"
    create: true
    mode: "0644"

- name: Deliver what a Claude session reads
  ansible.builtin.import_tasks: claude.yml

# pi's model key is the one key an agent can read.
- name: Deliver pi's models
  when: "'litellm-key' in wk_store_names and wk_litellm_url is defined and not ansible_check_mode"
  no_log: true
  block:
    - name: Ask the endpoint for its models
      ansible.builtin.uri:
        url: "{{ wk_litellm_url | regex_replace('/+$', '') }}/models"
        headers:
          Authorization: "Bearer {{ lookup('ansible.builtin.pipe', wk_bao_get ~ 'litellm-key') }}"
      delegate_to: localhost
      register: wk_models

    - name: Make pi's directory
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.pi/agent"
        state: directory
        mode: "0700"

    - name: Write pi's models.json
      ansible.builtin.copy:
        content: "{{ wk_pi_models | to_nice_json }}\n"
        dest: "{{ ansible_facts['env']['HOME'] }}/.pi/agent/models.json"
        mode: "0600"
      diff: false
      vars:
        wk_pi_models:
          providers:
            litellm:
              baseUrl: "{{ wk_litellm_url }}"
              api: openai-completions
              apiKey: "{{ lookup('ansible.builtin.pipe', wk_bao_get ~ 'litellm-key') }}"
              models: "{{ wk_models.json.data | default([], true) | map(attribute='id') | map('community.general.dict_kv', 'id') | list }}"
