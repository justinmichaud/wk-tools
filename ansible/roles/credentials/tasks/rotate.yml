---
# The server's push keys, rotated on the controller by `wk key rotate`, and the server's rotation key: a new ed25519
# key whose private half the server holds and whose public half is the one line of the controller's authorized_keys
# that names this server. That line runs the server's rotation and nothing else; each run replaces it.

- name: Rotate the push keys
  ansible.builtin.command:
    argv: ["{{ wk_root }}/wk", key, rotate, "{{ inventory_hostname }}", --yes]
  delegate_to: localhost
  register: wk_rotated
  no_log: true

- name: Deliver each fork's push key
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "{{ wk_secrets }}/deploy/{{ item.key | replace('/', '--') }}"
    mode: "0600"
  loop: "{{ wk_rotated.stdout | from_json | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true
  diff: false

- name: Make the rotation key
  delegate_to: localhost
  block:
    - name: Make a scratch directory for it
      ansible.builtin.tempfile:
        state: directory
      register: wk_scratch

    - name: Make the key
      ansible.builtin.command:
        argv: [ssh-keygen, -q, -t, ed25519, -N, "", -C, "wk-rotate {{ inventory_hostname }}", -f, "{{ wk_scratch.path }}/key"]

    - name: Read the key
      ansible.builtin.set_fact:
        wk_rotate_private: "{{ lookup('ansible.builtin.file', wk_scratch.path ~ '/key', rstrip=false) }}"
        wk_rotate_public: "{{ lookup('ansible.builtin.file', wk_scratch.path ~ '/key.pub').split()[:2] | join(' ') }}"
      no_log: true

  always:
    - name: Remove the scratch directory
      ansible.builtin.file:
        path: "{{ wk_scratch.path }}"
        state: absent
      when: wk_scratch.path is defined

- name: Deliver the rotation key's private half
  ansible.builtin.copy:
    content: "{{ wk_rotate_private }}"
    dest: "{{ wk_secrets }}/rotate-key"
    mode: "0600"
  no_log: true
  diff: false

- name: Make the controller's ssh directory
  ansible.builtin.file:
    path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh"
    state: directory
    mode: "0700"
  delegate_to: localhost

- name: Let the rotation key run this server's rotation on the controller, and nothing else
  ansible.builtin.lineinfile:
    path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/authorized_keys"
    regexp: " wk-rotate {{ inventory_hostname | regex_escape }}$"
    line: 'restrict,command="{{ wk_rotate_command }}" {{ wk_rotate_public }} wk-rotate {{ inventory_hostname }}'
    create: true
    mode: "0600"
  delegate_to: localhost
