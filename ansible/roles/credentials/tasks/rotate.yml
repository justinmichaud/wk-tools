---
# The server's push keys, rotated on the controller by `wk key rotate`.

- name: Rotate the push keys
  ansible.builtin.command:
    argv: ["{{ wk_root }}/wk", key, rotate, "{{ inventory_hostname }}", --yes]
  delegate_to: localhost
  register: wk_rotated
  no_log: true

- name: Deliver each fork's push key
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "{{ wk_secrets }}/deploy/{{ item.key | replace('/', '--') }}"
    mode: "0600"
  loop: "{{ wk_rotated.stdout | from_json | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true
  diff: false
