---
# The names the store holds, asked on the client: `wk key ls` is the bao CLI's `kv list`, followed into each folder.
# It exits 4 when the store cannot be asked (no `bao login` yet, or no answer): then nothing of the store's is
# delivered, and the run says so and goes on.
- name: Ask the store for its names
  ansible.builtin.command:
    argv: ["{{ wk_root }}/wk", key, ls]
  delegate_to: localhost
  environment: "{{ wk_client_env }}"
  register: wk_store
  changed_when: false
  failed_when: wk_store.rc not in [0, 4]
  check_mode: false

- name: Say that the store could not be asked
  ansible.builtin.debug:
    msg: "nothing of the store's is delivered: {{ wk_store.stderr | trim }}"
  when: wk_store.rc == 4

- name: Keep the names
  ansible.builtin.set_fact:
    wk_store_names: "{{ wk_store.stdout_lines if wk_store.rc == 0 else [] }}"
