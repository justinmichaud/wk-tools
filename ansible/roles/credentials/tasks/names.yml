---
# The names of the credentials the controller holds: `wk key ls`, run there.
- name: Ask for the credentials' names
  ansible.builtin.command:
    argv: ["{{ wk_root }}/wk", key, ls]
  delegate_to: localhost
  register: wk_store
  changed_when: false
  check_mode: false

- name: Keep the names
  ansible.builtin.set_fact:
    wk_store_names: "{{ wk_store.stdout_lines }}"
