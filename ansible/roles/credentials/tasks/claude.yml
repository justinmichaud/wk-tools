---
# What a Claude session reads, neither of them a credential: the placeholder claude.ai login, and the CA of the
# injector that replaces it.

- name: Look for the injector's CA on the credential server
  ansible.builtin.stat:
    path: ~/wk/injector/ca.pem
  delegate_to: "{{ wk_credential_server }}"
  register: wk_ca

- name: Assert the injector has made its CA
  ansible.builtin.assert:
    that: wk_ca.stat.exists
    fail_msg: >-
      {{ wk_credential_server }} has no injector yet, so there is no CA to deliver:
      wk machine setup {{ wk_credential_server }}
    quiet: true

- name: Read the injector's CA
  ansible.builtin.slurp:
    src: ~/wk/injector/ca.pem
  delegate_to: "{{ wk_credential_server }}"
  register: wk_ca_pem

- name: Deliver the injector's CA
  ansible.builtin.copy:
    content: "{{ wk_ca_pem.content | b64decode }}"
    dest: "{{ wk_home }}/injector-ca.pem"
    mode: "0644"

- name: Make the placeholder login's directory
  ansible.builtin.file:
    path: "{{ wk_home }}/claude-login"
    state: directory
    mode: "0755"

- name: Deliver the placeholder login
  ansible.builtin.copy:
    content: "{{ wk_claude_placeholder | to_json }}\n"
    dest: "{{ wk_home }}/claude-login/.credentials.json"
    mode: "0600"
