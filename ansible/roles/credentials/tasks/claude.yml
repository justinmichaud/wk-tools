---
# What a Claude session reads, neither of them a credential: the placeholder claude.ai login, and the CA of the
# injector that replaces it.

- name: Look for the injector's CA on the controller
  ansible.builtin.stat:
    path: "{{ wk_controller_home }}/injector/ca.pem"
  delegate_to: localhost
  register: wk_ca

- name: Assert the injector has made its CA
  ansible.builtin.assert:
    that: wk_ca.stat.exists
    fail_msg: >-
      {{ wk_controller }} has no injector yet, so there is no CA to deliver:
      wk machine setup {{ wk_controller }}
    quiet: true

- name: Deliver the injector's CA
  ansible.builtin.copy:
    src: "{{ wk_controller_home }}/injector/ca.pem"
    dest: "{{ wk_home }}/injector-ca.pem"
    mode: "0644"

- name: Make the placeholder login's directory
  ansible.builtin.file:
    path: "{{ wk_home }}/claude-login"
    state: directory
    mode: "0755"

- name: Deliver the placeholder login
  ansible.builtin.copy:
    content: "{{ wk_claude_placeholder | to_json }}\n"
    dest: "{{ wk_home }}/claude-login/.credentials.json"
    mode: "0600"
