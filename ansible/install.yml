---
# Installing a server's operating system from nothing, unattended, through its BMC, run on the controller.
# `wk machine install <server>` runs
#   ansible-playbook -i ansible/inventory.py --limit <server> [--skip-tags wipe] [--check --diff] ansible/install.yml
# Ubuntu's own autoinstall does the installing. The image reaches the server as OpenBMC's virtual USB disk: qemu-nbd
# serves it on the controller and websocat carries that to the BMC's virtual-media websocket. Redfish sets the one boot.
# The server's disk is erased. `--skip-tags wipe` stops once the server has seen the image: nothing boots, nothing is
# erased. `--check` reads the credentials, asks the BMC and makes nothing.

- name: Install a server through its BMC
  hosts: all
  gather_facts: false
  vars:
    wk_install_name: "{{ inventory_hostname }}"
    wk_install_user: "{{ wk_user | default(lookup('ansible.builtin.env', 'USER')) }}"
    wk_install_image: "{{ wk_ubuntu[wk_os][wk_arch] }}"
    wk_install_codename: "{{ wk_ubuntu[wk_os].codename }}"
    wk_install_stock: "{{ lookup('ansible.builtin.env', 'HOME') }}/.cache/wk/{{ wk_install_image.url | basename }}"
    wk_install_build: "{{ wk_install_stock | dirname }}/wk-install-{{ inventory_hostname }}"
    wk_install_iso: "{{ wk_install_build }}/install.iso"
    wk_install_socket: "{{ wk_install_build }}/nbd.sock"
    wk_install_consoles: "{{ ('console=' ~ wk_console ~ ' ') if wk_console is defined else '' }}console=tty0"
    wk_install_system: "https://{{ wk_bmc }}/redfish/v1/Systems/system"
    wk_install_console: "ssh -p {{ wk_install_console_port }} {{ wk_install_secret.bmc_user }}@{{ wk_bmc }}"
    wk_install_tools:
      - {tool: xorriso, asks: -version, fix: sudo apt install xorriso, does: puts the autoinstall file into Ubuntu's image}
      - {tool: qemu-nbd, asks: --version, fix: sudo apt install qemu-utils, does: serves the image to the BMC}
      - {tool: "{{ wk_websocat }}", asks: --version, fix: "wk machine setup {{ wk_controller }} --stage controller",
         does: carries the image to the BMC's websocket}
    wk_install_needs: >-
      {{ ['bmc/' ~ inventory_hostname ~ '/user', 'bmc/' ~ inventory_hostname ~ '/password', 'tailnet-auth-key', 'tailnet-api-key']
         + (['wifi-ssid', 'wifi-psk'] if wk_wifi is defined else []) }}
  # The password is masked by the modules themselves, so what a BMC answers stays readable.
  module_defaults:
    community.general.redfish_info: &bmc
      baseuri: "{{ wk_bmc }}"
      username: "{{ wk_install_secret.bmc_user }}"
      password: "{{ wk_install_secret.bmc_password }}"
    community.general.redfish_command: *bmc

  tasks:
    - name: Ask before anything is made
      ansible.builtin.import_tasks: install/preflight.yml
      delegate_to: localhost

    - name: Stop here in check mode
      ansible.builtin.meta: end_play
      when: ansible_check_mode

    - name: Install
      block:
        - name: Make the image
          ansible.builtin.import_tasks: install/image.yml
          delegate_to: localhost

        - name: Attach the image to the server
          ansible.builtin.import_tasks: install/media.yml

        - name: Boot the installer from it and wait for the installed system
          ansible.builtin.import_tasks: install/boot.yml
          tags: [wipe]

      always:
        - name: Take the image away
          delegate_to: localhost
          block:
            - name: Detach the image
              ansible.builtin.import_tasks: install/detach.yml

            # Without If-Match, as the boot was set (install/boot.yml).
            - name: Clear the boot override
              ansible.builtin.uri:
                url: "{{ wk_install_system }}"
                method: PATCH
                url_username: "{{ wk_install_secret.bmc_user }}"
                url_password: "{{ wk_install_secret.bmc_password }}"
                force_basic_auth: true
                validate_certs: false
                body_format: json
                body:
                  Boot:
                    BootSourceOverrideEnabled: Disabled
                status_code: [200, 204]
              tags: [wipe]

          always:
            # It holds the WiFi passphrase, the tailnet auth key and the BMC's login.
            - name: Remove the image and everything made beside it
              ansible.builtin.file:
                path: "{{ wk_install_build }}"
                state: absent
