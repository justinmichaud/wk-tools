---
# Everything here is tagged `wipe` by the play. The installer is booted once from the USB disk, erases the server's
# disk, and restarts into the installed system by itself; nothing asks the BMC whether the machine is on. The old
# system's tailnet node is kept until the new one exists, so a server whose installer never started stays reachable.

- name: Boot the installer and wait for the installed system
  block:
    - name: Note when the install began
      ansible.builtin.set_fact:
        wk_install_began: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"

    - name: Boot from the USB disk once
      community.general.redfish_command:
        category: Systems
        command: SetOneTimeBoot
        bootdevice: "{{ wk_install_boot_device }}"
        boot_override_mode: UEFI
      delegate_to: localhost

    - name: Restart the server from its own system
      ansible.builtin.command:
        argv: [shutdown, --reboot, "+1"]
      become: true
      vars:
        ansible_become_password: "{{ wk_install_secret.sudo_password }}"
      when: wk_install_up

    - name: Restart the server through its BMC
      community.general.redfish_command:
        category: Systems
        command: "{{ wk_install_reset }}"
      delegate_to: localhost
      when: not wk_install_up

    # The installed system joins under the server's name; while the old node holds it, Tailscale calls the new one <name>-<n>.
    - name: Wait for the installed system to join the tailnet
      ansible.builtin.uri:
        url: "{{ wk_tailnet_api }}/tailnet/-/devices"
        headers:
          Authorization: "Bearer {{ wk_install_secret.api_key }}"
      delegate_to: localhost
      register: wk_devices
      until: wk_devices.json.devices | selectattr('name', 'match', wk_install_node) | selectattr('created', 'ge', wk_install_began) | list | length == 1
      retries: "{{ wk_install_minutes * 2 }}"
      delay: 30
      no_log: true

    - name: Retire the old system's tailnet node
      ansible.builtin.uri:
        url: "{{ wk_tailnet_api }}/device/{{ item }}"
        method: DELETE
        headers:
          Authorization: "Bearer {{ wk_install_secret.api_key }}"
      delegate_to: localhost
      loop: "{{ wk_devices.json.devices | selectattr('name', 'match', wk_install_node) | selectattr('created', 'lt', wk_install_began) | map(attribute='nodeId') }}"
      no_log: true

    - name: Give the new node the server's name
      ansible.builtin.uri:
        url: "{{ wk_tailnet_api }}/device/{{ item }}/name"
        method: POST
        body_format: json
        body:
          name: "{{ inventory_hostname }}"
        headers:
          Authorization: "Bearer {{ wk_install_secret.api_key }}"
      delegate_to: localhost
      loop: "{{ wk_devices.json.devices | selectattr('name', 'match', wk_install_node) | selectattr('created', 'ge', wk_install_began) | map(attribute='nodeId') }}"
      no_log: true

    # The new system has new host keys.
    - name: Forget the old system's host key
      ansible.builtin.known_hosts:
        name: "{{ inventory_hostname }}"
        state: absent
      delegate_to: localhost

    - name: Wait for the server to answer ssh by its tailnet name
      ansible.builtin.wait_for_connection:
        timeout: "{{ wk_install_boot_minutes * 60 }}"
        sleep: 15

  rescue:
    - name: Say that the install did not finish
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} was not installed: the task "{{ ansible_failed_task.name }}" failed
          ({{ ansible_failed_result.msg | default('it logs nothing') }}). The image is detached and the boot override
          cleared now. The server's serial console shows where it stands: `{{ wk_install_console }}`, with the controller's
          bmc/{{ inventory_hostname }}/password. A server that still answers as before never booted the image, and its
          old system is untouched. An installer that stopped has /var/log/installer; an installed system that did not
          join has /var/log/cloud-init-output.log, where `tailscale up` says what it made of tailnet-auth-key
  vars:
    wk_install_node: "^{{ inventory_hostname | regex_escape }}(-[0-9]+)?[.]"
