---
- name: Eject the image
  community.general.redfish_command:
    category: "{{ wk_install_media_category }}"
    command: VirtualMediaEject
    virtual_media:
      image_url: "{{ wk_install_url }}"
  delegate_to: localhost
  register: wk_ejected
  # A BMC that holds no such image has nothing to eject.
  failed_when: wk_ejected.failed | default(false) and 'No VirtualMedia resource found' not in wk_ejected.msg | default('')
