---
# What must hold before an image is made: one server, its conf, the controller's tools, key and credentials, and a BMC that
# answers this login and can boot from USB once. Nothing here changes anything, so all of it runs in check mode too.

- name: Assert the play has one server
  ansible.builtin.assert:
    that: ansible_play_hosts_all | length == 1
    fail_msg: "install.yml erases the disk of every host it is given, and this run has {{ ansible_play_hosts_all | length }}: pass --limit <server>"
    quiet: true

- name: Assert the conf says how this server is installed
  ansible.builtin.assert:
    that:
      - wk_kind == 'linux'
      - wk_bmc is defined
      - wk_os | default('') in wk_ubuntu
      - wk_arch | default('') in wk_ubuntu[wk_os | default('')] | default({})
    fail_msg: >-
      machines/{{ inventory_hostname }}.conf must be a Linux server's and set bmc=, arch= and os=; the pinned releases
      are {{ wk_ubuntu.keys() | join(', ') }}, each for arm64 and amd64 (DESIGN.md, Installing a server)
    quiet: true

- name: Ask each tool for its version
  ansible.builtin.command:
    argv: ["{{ item.tool }}", "{{ item.asks }}"]
  loop: "{{ wk_install_tools }}"
  loop_control:
    label: "{{ item.tool }}"
  register: wk_tools
  changed_when: false
  failed_when: false
  check_mode: false

- name: Assert the controller has each tool
  ansible.builtin.assert:
    that: item.rc == 0
    fail_msg: "the controller has no {{ item.item.tool }}, which {{ item.item.does }}: {{ item.item.fix }}"
    quiet: true
  loop: "{{ wk_tools.results }}"
  loop_control:
    label: "{{ item.item.tool }}"

- name: Find the controller's ssh public key
  ansible.builtin.set_fact:
    wk_install_public_keys: >-
      {{ query('ansible.builtin.first_found', {'files': ['id_ed25519.pub', 'id_ecdsa.pub', 'id_rsa.pub'],
                                               'paths': [lookup('ansible.builtin.env', 'HOME') ~ '/.ssh'], 'skip': true}) }}

- name: Assert the controller has an ssh public key
  ansible.builtin.assert:
    that: wk_install_public_keys | length == 1
    fail_msg: "the controller has no ssh public key to authorise on {{ inventory_hostname }}: ssh-keygen -t ed25519"
    quiet: true

- name: Ask for the credentials' names
  ansible.builtin.import_tasks: ../roles/credentials/tasks/names.yml

- name: Assert the controller holds what an install reads
  ansible.builtin.assert:
    that: wk_install_needs | difference(wk_store_names) | length == 0
    fail_msg: >-
      the controller holds no {{ wk_install_needs | difference(wk_store_names) | join(', ') }}: wk key set <name> for each
    quiet: true

- name: Read the secrets
  ansible.builtin.set_fact:
    wk_install_public_key: "{{ lookup('ansible.builtin.file', wk_install_public_keys[0]) }}"
    wk_install_secret:
      bmc_user: "{{ lookup('ansible.builtin.file', wk_store ~ '/bmc/' ~ inventory_hostname ~ '/user') }}"
      bmc_password: "{{ lookup('ansible.builtin.file', wk_store ~ '/bmc/' ~ inventory_hostname ~ '/password') }}"
      auth_key: "{{ lookup('ansible.builtin.file', wk_store ~ '/tailnet-auth-key') }}"
      api_key: "{{ lookup('ansible.builtin.file', wk_store ~ '/tailnet-api-key') }}"
      ssid: "{{ lookup('ansible.builtin.file', wk_store ~ '/wifi-ssid') if wk_wifi is defined else '' }}"
      psk: "{{ lookup('ansible.builtin.file', wk_store ~ '/wifi-psk') if wk_wifi is defined else '' }}"
      sudo_password: "{{ lookup('ansible.builtin.file', wk_store ~ '/sudo-password') if 'sudo-password' in wk_store_names else '' }}"
  no_log: true

- name: Ask the BMC for the system
  community.general.redfish_info:
    category: Systems
    command: GetBootOverride
  register: wk_boot

- name: Assert the BMC can boot the server from USB once
  ansible.builtin.assert:
    that: wk_install_boot_device in wk_boot.redfish_facts.boot_override.entries[0][1]['BootSourceOverrideTarget@Redfish.AllowableValues']
    fail_msg: >-
      the BMC at {{ wk_bmc }} offers no one-time boot from {{ wk_install_boot_device }}, which is where OpenBMC's virtual
      media appears: it offers {{ wk_boot.redfish_facts.boot_override.entries[0][1]['BootSourceOverrideTarget@Redfish.AllowableValues'] | default([]) | join(', ') }}
    quiet: true
