---
# Provisioning, whole, run on the controller. `wk machine setup <machine>` runs it against the inventory
# `wk machine inventory` prints:
#   ansible-playbook -i ansible/inventory.py --limit <machine> [--tags <role>] ansible/site.yml
# Nothing here needs root. The credentials are files on the controller, read by the `file` lookup.

- name: Converge a server, the controller or a workstation
  hosts: all
  gather_facts: false
  vars:
    wk_home: "{{ wk_controller_home if 'controller' in group_names else ansible_facts['env']['HOME'] ~ '/wk' }}"
    # A user unit is reached over the user's bus, which an ssh session without a login does not name.
    wk_user_bus:
      XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"

  pre_tasks:
    - name: Gather the facts the roles read
      ansible.builtin.setup:
        gather_subset: [min]
      tags: [always]

    # sshd runs a command under a non-login shell, whose PATH lacks ~/.local/bin and Homebrew.
    - name: Read the PATH of a login shell
      ansible.builtin.command:
        argv: ["{{ ansible_facts['user_shell'] }}", "-lc", 'printf %s "$PATH"']
      register: wk_login_path
      changed_when: false
      check_mode: false
      tags: [always]

    # A user unit runs without a login session only while the user lingers.
    - name: Let the user's units run without a login
      ansible.builtin.command:
        argv: [loginctl, enable-linger, "{{ ansible_facts['user_id'] }}"]
        creates: "/var/lib/systemd/linger/{{ ansible_facts['user_id'] }}"
      when: "'linux' in group_names or 'controller' in group_names"
      tags: [pueue, controller]

    - name: Make the directory of the user's units
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user"
        state: directory
        mode: "0755"
      when: "'linux' in group_names or 'controller' in group_names"
      tags: [pueue, controller]

  tasks:
    - name: Run the roles under the login shell's PATH
      environment:
        PATH: "{{ wk_login_path.stdout }}"
      block:
        - name: Install Xcode
          ansible.builtin.import_role:
            name: xcode
          when: "'mac' in group_names"
          tags: [xcode]

        - name: Set up where the person sits, git first
          ansible.builtin.import_role:
            name: workstation
          when: "'workstation' in group_names"
          tags: [workstation]

        - name: Install wk itself
          ansible.builtin.import_role:
            name: wk
          when: "'controller' not in group_names"
          tags: [wk]

        - name: Install pueue and keep its daemon running
          ansible.builtin.import_role:
            name: pueue
          when: "'linux' in group_names or 'mac' in group_names"
          tags: [pueue]

        - name: Make the mirror
          ansible.builtin.import_role:
            name: mirror
          when: "'linux' in group_names or 'mac' in group_names"
          tags: [mirror]

        - name: Prepare the SDK container's build environment
          ansible.builtin.import_role:
            name: sdk
          when: "'linux' in group_names"
          tags: [sdk]

        - name: Install the agents
          ansible.builtin.import_role:
            name: agents
          when: "'linux' in group_names or 'mac' in group_names"
          tags: [agents]

        - name: Install websocat and the injector
          ansible.builtin.import_role:
            name: controller
          when: "'controller' in group_names"
          tags: [controller]

        - name: Deliver the credentials
          ansible.builtin.import_role:
            name: credentials
          when: "'linux' in group_names or 'mac' in group_names"
          tags: [credentials]
