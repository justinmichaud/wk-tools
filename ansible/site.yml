---
# Provisioning, whole. `wk machine setup <server>` runs it against the inventory `wk machine inventory` prints:
#   ansible-playbook -i ansible/inventory.py --limit <server> [--tags <role>] ansible/site.yml
# Nothing here needs root: sudo on the owner's servers asks for a password.

- name: Converge a server
  hosts: all
  gather_facts: false
  vars:
    wk_home: "{{ ansible_facts['env']['HOME'] }}/wk"
    # A user unit is reached over the user's bus, which an ssh session without a login does not name.
    wk_user_bus:
      XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"
    # A task delegated to the client runs the client's tools, not the server's.
    wk_client_env:
      PATH: "{{ lookup('ansible.builtin.env', 'PATH') }}"
      BAO_ADDR: "{{ wk_bao_addr }}"
    # One value of the store, read on the client by the bao CLI as the person: a pipe lookup's command line.
    wk_bao_get: "BAO_ADDR={{ wk_bao_addr | quote }} bao kv get -field=value -mount=secret wk/"

  pre_tasks:
    - name: Gather the facts the roles read
      ansible.builtin.setup:
        gather_subset: [min]
      tags: [always]

    # sshd runs a command under a non-login shell, whose PATH lacks ~/.local/bin and Homebrew.
    - name: Read the PATH of a login shell
      ansible.builtin.command:
        argv: ["{{ ansible_facts['user_shell'] }}", "-lc", 'printf %s "$PATH"']
      register: wk_login_path
      changed_when: false
      check_mode: false
      tags: [always]

    # A user unit runs without a login session only while the user lingers.
    - name: Let the user's units run without a login
      ansible.builtin.command:
        argv: [loginctl, enable-linger, "{{ ansible_facts['user_id'] }}"]
        creates: "/var/lib/systemd/linger/{{ ansible_facts['user_id'] }}"
      when: "'mac' not in group_names"
      tags: [pueue, openbao, injector]

    - name: Make the directory of the user's units
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user"
        state: directory
        mode: "0755"
      when: "'mac' not in group_names"
      tags: [pueue, openbao, injector]

  tasks:
    - name: Run the roles under the login shell's PATH
      environment:
        PATH: "{{ wk_login_path.stdout }}"
      block:
        - name: Install wk itself
          ansible.builtin.import_role:
            name: wk
          when: "'credential' not in group_names"
          tags: [wk]

        - name: Install pueue and keep its daemon running
          ansible.builtin.import_role:
            name: pueue
          when: "'credential' not in group_names"
          tags: [pueue]

        - name: Make the mirror
          ansible.builtin.import_role:
            name: mirror
          when: "'credential' not in group_names"
          tags: [mirror]

        - name: Prepare the SDK container's build environment
          ansible.builtin.import_role:
            name: sdk
          when: "'linux' in group_names"
          tags: [sdk]

        - name: Install the agents
          ansible.builtin.import_role:
            name: agents
          when: "'credential' not in group_names"
          tags: [agents]

        - name: Install OpenBao
          ansible.builtin.import_role:
            name: openbao
          when: "'credential' in group_names"
          tags: [openbao]

        - name: Install the injector
          ansible.builtin.import_role:
            name: injector
          when: "'credential' in group_names"
          tags: [injector]

        - name: Deliver the credentials
          ansible.builtin.import_role:
            name: credentials
          when: "'linux' in group_names or 'mac' in group_names"
          tags: [credentials]
