# tailnet-bridge-generic -- the PinePhone, in front of the Pi test boards.
#
# rpi3 and rpi4 sit on a cable with no route onto the tailnet of their own,
# so reaching them means being on the same LAN as them. This phone is that
# LAN, and it is on the tailnet:
#
#   house WiFi --wlan0-- [ PinePhone ] --lan0-- rpi4, rpi3
#                              |
#                       tailscaled advertises 10.99.1.0/24
#
# Fields are documented in bridge/provision.sh; see docs/HANDOFF-fleet.md and
# bridge/devices.sh for the hardware reasoning (which USB-C docks can carry
# ethernet on this phone, and why).

BR_DEVICE=pinephone
BR_SSH=tailnet-bridge-generic
BR_HOSTNAME=tailnet-bridge-generic
BR_TAG=tag:bridge
# 10.99.1.0/24, next to the BMC bridge's 10.99.0.0/24 and not overlapping it:
# both routes are advertised into the same tailnet, and tailscale resolves a
# duplicate subnet route by picking one node -- silently, not necessarily the
# one meant.
BR_SEGMENT=10.99.1.0/24
BR_ROUTER=10.99.1.1
BR_IF=lan0
# A pool, not a single address: this segment holds two boards today and gets
# a third the moment something else is put on the cable, and a board that
# silently fails to get an address is a board that looks broken.
BR_POOL=10.99.1.32,10.99.1.63
# rpi4's MAC (also MACH_MAC in boot/machines/rpi4.conf -- the same fact,
# since the board keeps it across every image it boots). rpi3 has no MAC
# reservation yet, so it takes a pool address until it does.
BR_LEASES="d8:3a:dd:aa:42:8a,10.99.1.10,rpi4"
# Autodetected by bridge/provision.sh from whatever adapter is enumerated at
# the time -- a property of the dock in use, not the phone, so left empty
# rather than pinned to a MAC that changes with the dock.
BR_LAN_MAC=""
# nat, unlike the BMC bridge: a test board fetches things (tailscale
# binaries, package updates), a BMC has no such need.
BR_EGRESS=nat
# Off: the camera stream is for watching a *screen* (moose's monitor), and
# there is no screen here.
BR_CAMERA=off
# tag:wk is the difference from the BMC bridge: workspaces must reach these
# boards, which is the whole point of putting them behind a bridge.
BR_REACHED_BY="autogroup:member, tag:workstation, tag:wk"
# <machine>:<device> -- the reader this bridge's cards get written on.
# Declared rather than discovered: picking the wrong /dev/sd* is the one
# mistake in this path that destroys something that was not yours to
# destroy. `wk bridge provision --disk` overrides it for a day the card is
# in a different machine.
BR_CARD=rpi5:/dev/mmcblk0
BR_USER=""
# Battery charge cap (docs/Urgent/HUMAN-battery.md): left at cmd/bridge's
# default (80%) and the power_supply node autodetected. Set BR_BATTERY to a
# node name under /sys/class/power_supply (e.g. axp20x-battery) only if this
# phone ever exposes more than one charge_control_end_threshold.
BR_BATTERY=""
BR_BATTERY_LIMIT=""
BR_NOTE="PinePhone; DHCP and routing for the rpi3/rpi4 cable segment"
