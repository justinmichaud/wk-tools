# tailnet-bridge-generic -- PinePhone in front of the rpi3/rpi4 cable segment; BR_SEGMENT must not collide with another bridge's, since tailscale resolves a duplicate subnet route by silently picking one node.

BR_DEVICE=pinephone
BR_SSH=tailnet-bridge-generic
BR_HOSTNAME=tailnet-bridge-generic
BR_TAG=tag:bridge
BR_SEGMENT=10.99.1.0/24
BR_ROUTER=10.99.1.1
BR_IF=lan0
BR_POOL=10.99.1.32,10.99.1.63
BR_LEASES="d8:3a:dd:aa:42:8a,10.99.1.10,rpi4"
BR_LAN_MAC=""
BR_EGRESS=nat
BR_CAMERA=off
BR_REACHED_BY="autogroup:member, tag:workstation, tag:wk"
BR_CARD=rpi5:/dev/mmcblk0
BR_USER=""
BR_BATTERY=""
BR_BATTERY_LIMIT=""
BR_NOTE="PinePhone; DHCP and routing for the rpi3/rpi4 cable segment"
