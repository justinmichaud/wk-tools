# tailnet-bridge-generic -- the PinePhone, in front of the Pi test boards.
#
# What it is for: rpi3 and rpi4 sit on a cable with no route onto the tailnet
# of their own (the rpi3 has no DNS entry and is not provisioned at all), so
# reaching them means being on the same LAN as them. This phone is that LAN,
# and it is on the tailnet, so a workspace can reach a board without anything
# on the house network being able to.
#
#   house WiFi --wlan0-- [ PinePhone ] --lan0-- rpi4, rpi3
#                              |
#                       tailscaled advertises 10.99.1.0/24
#
# Fields are documented in bridge/provision.sh; the ones worth arguing about
# here are BR_EGRESS and BR_REACHED_BY, because they are the two that differ
# from the BMC bridge and both differences are deliberate.

BR_DEVICE=pinephone
BR_SSH=tailnet-bridge-generic
BR_HOSTNAME=tailnet-bridge-generic
BR_TAG=tag:bridge

# 10.99.1.0/24, next to the BMC bridge's 10.99.0.0/24 and not overlapping it:
# both routes are advertised into the same tailnet, and tailscale resolves a
# duplicate subnet route by picking one node -- silently, and not necessarily
# the one you meant.
BR_SEGMENT=10.99.1.0/24
BR_ROUTER=10.99.1.1
BR_IF=lan0

# A pool, not a single address. The BMC bridge deliberately has room for
# exactly one client; this segment holds two boards today and gets a third the
# moment something else is put on the cable, and a board that silently fails to
# get an address is a board that looks broken.
BR_POOL=10.99.1.32,10.99.1.63

# Reservations, so a board's address survives a reflash and can be written down.
# rpi4's MAC is the one boot/machines.sh already declares (MACH_MAC) -- the same
# fact, and the reason it is a fact there is that the board keeps it across
# every image it boots. rpi3 has no MAC in the fleet table yet, so it takes a
# pool address until it does.
BR_LEASES="d8:3a:dd:aa:42:8a,10.99.1.10,rpi4"

# nat, unlike the BMC bridge.
#
# A test board has to be able to fetch things: `wk pi setup` downloads the
# tailscale binaries from pkgs.tailscale.com onto the board itself, an image
# seeds packages on first boot, and a Yocto rootfs updates nothing without
# egress. A BMC has no such need and every reason not to have it -- so that
# bridge sets `none` and this one does not, and neither inherits the other's
# answer by accident.
BR_EGRESS=nat

# Off. The camera stream is for watching a *screen* -- moose's monitor, when
# even the BMC console is not enough -- and there is no screen here.
BR_CAMERA=off

# Who should be able to reach the segment, in tailnet-policy terms. Printed by
# `wk bridge setup`; applying it is a console (or API) step, deliberately not
# something this repository does with a key it holds.
#
# tag:wk is the difference that matters: workspaces must reach the boards, which
# is the whole point of putting them behind a bridge. The BMC bridge must never
# grant tag:wk anything.
BR_REACHED_BY="autogroup:member, tag:workstation, tag:wk"

BR_NOTE="PinePhone; DHCP and routing for the rpi3/rpi4 cable segment"
