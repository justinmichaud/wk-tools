# tailnet-bridge-moose-bmc -- the Librem 5, in front of moose's BMC.
#
# The original bridge, and the one with the sharpest requirement: moose is
# reachable through this phone when moose is powered off, hung, or has no
# working OS. The BMC's own configuration resets on every power loss, so
# nothing here may depend on a BMC-side setting -- it gets its address by DHCP
# and tailscale's subnet-router SNAT means it never needs a route back.
#
#   house WiFi --wlan0-- [ Librem 5 ] --lan0-- moose's dedicated BMC port
#                              |
#                       tailscaled advertises 10.99.0.0/24
#
# Declared here but *not yet provisioned from this repository*: the phone is
# still running the hand-built PureOS/systemd configuration this role replaces.
# `wk bridge setup tailnet-bridge-moose-bmc` is what to run once it has been
# reflashed with postmarketOS, and it will refuse to touch a phone that is not
# running pmOS rather than half-apply itself over the old one.

BR_DEVICE=librem5
BR_SSH=tailnet-bridge-moose-bmc
BR_HOSTNAME=tailnet-bridge-moose-bmc
BR_TAG=tag:bridge

BR_SEGMENT=10.99.0.0/24
BR_ROUTER=10.99.0.1
BR_IF=lan0

# One address, and the pool is that address. This segment holds exactly one
# device by design: anything else that appears on the cable is a mistake --
# most memorably moose's own onboard NIC, which took the address and kept it
# because the lease is infinite, and the BMC was then refused with "no address
# available". The reservation below is what makes the outcome deterministic
# instead of first-come; `wk bridge status` prints the lease so the mistake is
# visible rather than mysterious.
BR_POOL=10.99.0.2,10.99.0.2
BR_LEASES="9c:6b:00:75:5a:d7,10.99.0.2,altrad8ud2-1l2q"

# none. The BMC has no reason to reach the internet and every reason not to:
# its credentials revert to factory defaults on a power loss, so it is the
# least trustworthy device on any segment it is on.
BR_EGRESS=none

# The point of the camera on this bridge: pointed at moose's monitor, it shows
# the screen when the BMC's own console cannot -- firmware that draws nothing,
# a GPU that has taken over, a machine that never got as far as the BMC's
# framebuffer. Streams only while the camera kill switch is on, which is
# enforced by the hardware rather than by this setting: switch off, no capture
# device, service stays down.
BR_CAMERA=http

# Humans and workstations only. Never tag:wk and never tag:app: root on this
# phone is equivalent to moose's out-of-band console, so a compromised
# container or home service must not be one ssh from it.
BR_REACHED_BY="autogroup:member, tag:workstation"

BR_NOTE="Librem 5; DHCP, routing and NTP for moose's BMC port"
