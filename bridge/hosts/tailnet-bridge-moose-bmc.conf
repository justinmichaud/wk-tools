# tailnet-bridge-moose-bmc -- Librem 5 in front of moose's BMC; the BMC's own configuration reverts to factory defaults on every power loss, so nothing here may depend on a BMC-side setting.

BR_DEVICE=librem5
BR_SSH=tailnet-bridge-moose-bmc
BR_HOSTNAME=tailnet-bridge-moose-bmc
BR_TAG=tag:bridge
BR_SEGMENT=10.99.0.0/24
BR_ROUTER=10.99.0.1
BR_IF=lan0
BR_POOL=10.99.0.2,10.99.0.2
BR_LEASES="9c:6b:00:75:5a:d7,10.99.0.2,altrad8ud2-1l2q"
BR_LAN_MAC=""
BR_EGRESS=none
BR_CAMERA=http
BR_REACHED_BY="autogroup:member, tag:workstation"
BR_CARD=rpi5:/dev/mmcblk0
BR_USER=""
BR_BATTERY=""
BR_BATTERY_LIMIT=""
BR_NOTE="Librem 5; DHCP, routing and NTP for moose's BMC port"
