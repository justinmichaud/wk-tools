# rpi4 -- the bootloader will not USB-MSD-boot this stick: tryboot loads the bench kernel from the SD card and it mounts /dev/sda by PARTUUID. mac is wlan0's, not eth0's (…:8a), which has no cable.

kind=board
ssh="rpi4-rescue"
driver=pi-tryboot
device=/dev/sda
root=/dev/mmcblk0p2
image_preset=webkit-2.52-yocto-rpi4-64
mac=d8:3a:dd:aa:42:8b
bridge=""
role=bench-device
os=any
volume=""
dtb=bcm2711-rpi-4-b.dtb
bench_ssh=rpi4-bench
net=wifi
display=""   # only a mac pins a display; this machine has none to compare
note="Raspberry Pi 4 (4 GB), on the house LAN. Bench system on the USB drive (tried first); rescue on the SD card."
