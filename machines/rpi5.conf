# rpi5 -- D0 silicon (16 GB Pi 5, revision e04171): the firmware asks for the stepping's device tree, and the plain bcm2712 one panics in bcm2712_pull_config_set before rootfs.

kind=board
ssh=rpi5
driver=rpi5-usb
device=/dev/sda
root=/dev/nvme0n1p2
image_preset=webkit-2.52-yocto-rpi5-64
mac=88:a2:9e:07:1c:92
bridge=""
role=workstation
os=any
volume=""
dtb=bcm2712-rpi-5-b.dtb
bench_ssh=rpi5-bench
net=wifi
display=""   # only a mac pins a display; this machine has none to compare
note="Raspberry Pi 5, WiFi only. USB one-shot; the NVMe workstation is untouched."
