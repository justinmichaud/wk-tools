# mbp -- this Mac. bench_ssh is a second ssh stanza (dotfiles/ssh/config) at the same address, so the two installs' host keys never collide.

kind=mac
ssh="tolken"
driver=mac-volume
device=""
root=""
profile=perf-macos-tolken
mac=""
bridge=""
role=workstation
os=macos
volume="WK Bench"
display="builtin 1280x832"   # the mode the bench install is held at, in points: 1280x832 at scale 2 is exactly the 2560x1664 panel, so no frame is downsampled. The autorun writes it and reboots if the install comes up at another.
dtb=""
bench_ssh="tolken-bench"
net=wifi
note="This Mac. Boots a benchmark volume; the selection is a command, signed with a volume owner's credential."
