# rpi3 -- one SD card holds every system. mac is eth0's; this board has been seen holding two DHCP leases at once, so image_addr prefers a REACHABLE neighbour.

kind=board
ssh="rpi3-rescue"
driver=pi-sd
device=/dev/mmcblk0
root=/dev/mmcblk0p2
mac=b8:27:eb:9a:07:29
bridge=""
role=bench-device
os=any
volume=""
profile=webkit-2.52-yocto-rpi3-32
dtb=bcm2710-rpi-3-b.dtb
bench_ssh=rpi3-bench
net=wifi
display=""   # only a mac pins a display; this machine has none to compare
note="Raspberry Pi 3 (armv7l, 931 MB), on the house LAN. One SD card: rescue on p1-p2, bench system on p3-p4."
