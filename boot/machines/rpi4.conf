# rpi4 -- Raspberry Pi 4B (4 GB), wired. Boots its USB stick; SD is the rescue.
#
# Two media, two jobs, and the distinction is load-bearing rather than
# descriptive. MACH_DEVICE (/dev/sda, the stick) is where a *bench system* is
# written and armed. MACH_ROOT (/dev/mmcblk0p2, the SD) is the **base image**:
# the resilient helper this board falls back to whenever the stick is unarmed,
# absent or unbootable. Its job is to keep the board reachable and to let
# another system be written and recovered. It is never measured -- `wk pi bench`
# refuses it, on the evidence of which medium the running root is on
# (b_system_kind, boot/machines.sh), because every image wk writes carries
# /etc/wk-image and the marker alone cannot tell the two apart.
#
# Open, and worth knowing before trusting the fallback: the SD was written from
# a *bench* profile (the 2.48 rpi4 image), so it carries the self-return
# watchdog -- it reboots itself every 15 minutes unless something claims it,
# which is exactly wrong for a helper that may be part-way through writing a
# card. A rescue-role image (IMG_ROLE=rescue, image/profiles.sh) gets no
# watchdog and no self-disarm; this card has not been rewritten with one yet.
# docs/TESTING.md section 7 carries it.
#
# From nothing: `wk sysimage build webkit-2.52-yocto-rpi4-64` onto the SD
# card (the rescue/host system), `wk pi setup rpi4-test` for the tailnet,
# `wk pi boot-order rpi4-test usb-first`, then `wk sysimage build
# perf-linux-rpi4` + `wk sysimage write` for the stick.

# Not `rpi4`: a hand-written `Host rpi4` in ~/.ssh/config used to point at
# rpi4-compilers-0, a shared build box behind a ProxyJump, and a
# `wk sysimage write` aimed at this bench device would have landed on that
# machine's disk. host/dotfiles.sh now drops any hand-written stanza naming a
# fleet machine, so the collision cannot come back -- and the names stay
# apart on purpose, so that `Host rpi4` reads as the mistake it is rather
# than as an alternative spelling of this one.
MACH_SSH="${WK_RPI4_SSH:-rpi4-test}"
# pi-usb: the bench lane is local media, fleet-wide -- a local root keeps the
# network out of the measurement, and a stick with nothing bootable on it is
# skipped rather than halted on.
MACH_DRIVER=pi-usb
MACH_DEVICE=/dev/sda
MACH_ROOT=/dev/mmcblk0p2
MACH_PROFILE=perf-linux-rpi4
# The wired NIC's address. It used to be here because the board's DHCP leases
# were unstable (firmware and kernel present different client identifiers) and
# had to be found by MAC in the neighbour table. Since 2026-08-22 it earns its
# place twice over: this is the MAC
# bridge/hosts/tailnet-bridge-generic.conf reserves 10.99.1.10 against, so the
# board now has one address that survives a reflash -- the same fact, doing
# more work. `raspberrypi4-64.local` is no longer the only fixed name and is no
# longer reachable at all: the board is on the cable behind the bridge, and
# mDNS does not cross it (dotfiles/ssh/config has the whole reasoning).
MACH_MAC=d8:3a:dd:aa:42:8a
# On the cable behind this bridge, which is why the MAC above is also a
# reservation. Recorded so that "unreachable" can say where to look next: the
# segment is a phone's USB ethernet, and when that adapter is absent every
# board on the cable goes quiet at once and none of them is at fault.
MACH_BRIDGE=tailnet-bridge-generic
# A dedicated bench device, not a workstation: that is what licenses a
# permanent usb-first BOOT_ORDER, and cmd/pi reads it from here.
MACH_ROLE=bench-device
MACH_OS=any
MACH_NOTE="Raspberry Pi 4 (4 GB), behind tailnet-bridge-generic. Boots its USB stick; SD is the rescue."
