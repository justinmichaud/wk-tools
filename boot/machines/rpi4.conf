# rpi4 -- Raspberry Pi 4B (4 GB), wired. Rescue on the USB stick; bench on the SD.
#
# Two media, two jobs, and which is which follows from the boot order rather
# than from preference. This board is usb-first, so the stick is what an
# untouched board comes up on -- and that has to be the **rescue**, so a board
# nobody has touched is a board that answers. MACH_DEVICE (/dev/sda, the stick)
# therefore holds the rescue, and the bench system goes on the SD.
#
# The arming byte works unchanged pointing the other way: a stick typed 0x0c
# boots the rescue, and typing it 0x83 steps the firmware over it onto the SD's
# bench system for one boot (boot/pi-usb.sh). It is never measured -- `wk pi bench`
# refuses it, on the evidence of which medium the running root is on
# (b_system_kind, boot/machines.sh), because every image wk writes carries
# /etc/wk-image and the marker alone cannot tell the two apart.
#
# Open: the SD still holds an image written as a *bench* system from before this
# arrangement, so it carries a live self-return watchdog. That is the medium the
# bench system belongs on, so the watchdog is not wrong there -- but the image on
# it predates the tailnet layer and has no tailscale, so it is not reachable by
# name. Rewriting it needs the card in a reader.
#
# The steps are not written here. `wk status` composes them from the fields
# below, per lane, so they cannot disagree with the machine they describe
# (b_reprovision, boot/pi-usb.sh).

# The tailnet name, and nothing else. There is no ssh stanza for this board and
# no address anywhere: it carries tailscale and joins on first boot, so the name
# resolves through MagicDNS (CLAUDE.md, "a node is reached by its tailnet name").
MACH_SSH="${WK_RPI4_SSH:-rpi4}"
# pi-usb: the bench lane is local media, fleet-wide -- a local root keeps the
# network out of the measurement, and a stick with nothing bootable on it is
# skipped rather than halted on.
MACH_DRIVER=pi-usb
MACH_DEVICE=/dev/sda
MACH_ROOT=/dev/mmcblk0p2
# The bench system this board is measured on. Its firmware settings are in
# image/webkit-2.52-yocto-rpi4-64/config.txt.append.
MACH_PROFILE=webkit-2.52-yocto-rpi4-64
# The wired NIC's hardware address. Not a route and not a reservation: it is the
# one fact this board keeps across every image it boots, so it is what a sweep
# looks for when the tailnet cannot name the board (reach_enumerate,
# lib/reach.sh). Nothing derives an address from it and nothing stores one.
MACH_MAC=d8:3a:dd:aa:42:8a
# On the cable behind this bridge, which is why the MAC above is also a
# reservation. Recorded so that "unreachable" can say where to look next: the
# segment is a phone's USB ethernet, and when that adapter is absent every
# board on the cable goes quiet at once and none of them is at fault.
MACH_BRIDGE=tailnet-bridge-generic
# A dedicated bench device, not a workstation: that is what licenses a
# permanent usb-first BOOT_ORDER, and cmd/pi reads it from here.
MACH_ROLE=bench-device
MACH_OS=any
MACH_NOTE="Raspberry Pi 4 (4 GB), behind tailnet-bridge-generic. Rescue on the USB stick (usb-first); bench system on the SD."
