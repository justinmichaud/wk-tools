# rpi4 -- Raspberry Pi 4B (4 GB), behind tailnet-bridge-generic.
#
# Two media, two jobs. The bench system goes on the USB drive (MACH_DEVICE):
# the firmware tries it first (`wk pi boot-order rpi4`, BOOT_ORDER 0xf14) and
# steps over it to the SD card whenever it is disarmed -- one byte of its
# partition table (boot/pi-mbr.sh) -- so a board nobody has touched is a
# board that answers. The rescue lives on the SD card (MACH_ROOT is its root
# partition): the two media have to sit behind different BOOT_ORDER nibbles,
# and USB is the one a fast SSD can hang off. The thumb drive there today
# reads 28 MB/s to the card's 46; it is a placeholder for that SSD.

# The rescue's tailnet name; the bench system joins as MACH_BENCH_SSH. Two
# systems wk wrote, two nodes: one name for both would make the second card's
# write collide with the first's node. No env override: renaming a fleet
# device is done by editing this conf.
MACH_SSH="rpi4-rescue"
MACH_DRIVER=pi-mbr
MACH_DEVICE=/dev/sda
MACH_ROOT=/dev/mmcblk0p2
# The bench system this board is measured on. Its firmware settings are in
# image/webkit-2.52-yocto-rpi4-64/config.txt.append.
MACH_PROFILE=webkit-2.52-yocto-rpi4-64
# The wired NIC's hardware address -- the one fact this board keeps across
# every image it boots, so it is what a sweep looks for when the tailnet
# cannot name the board (reach_enumerate, lib/reach.sh).
MACH_MAC=d8:3a:dd:aa:42:8a
# On the cable behind this bridge, which is also why MACH_MAC above is a
# reservation there: when the bridge's adapter is absent every board on the
# cable goes quiet at once and none of them is at fault.
MACH_BRIDGE=tailnet-bridge-generic
# A dedicated bench device licenses the permanent BOOT_ORDER (cmd/pi reads this field).
MACH_ROLE=bench-device
MACH_OS=any
MACH_LOCAL=""
MACH_VOLUME=""
# The device tree this board's firmware asks for (image_dtb_for, lib/image.sh).
MACH_DTB=bcm2711-rpi-4-b.dtb
# What a *bench* system written for this board joins the tailnet as.
MACH_BENCH_SSH=rpi4-bench
# No cable at the bench: its rescue/bench images bring up WiFi from a
# credential seeded onto the card (_image_wants_wifi, boot/disk.sh).
MACH_NET=wifi
MACH_NOTE="Raspberry Pi 4 (4 GB), behind tailnet-bridge-generic. Bench system on the USB drive (tried first); rescue on the SD card."
