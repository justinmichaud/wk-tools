# rpi4 -- the bootloader will not USB-MSD-boot this stick: tryboot loads the bench kernel from the SD card and it mounts /dev/sda by PARTUUID. NODE_MAC is wlan0's, not eth0's (…:8a), which has no cable.

NODE_SSH="rpi4-rescue"
NODE_DRIVER=pi-tryboot
NODE_DEVICE=/dev/sda
NODE_ROOT=/dev/mmcblk0p2
NODE_PROFILE=webkit-2.52-yocto-rpi4-64
NODE_MAC=d8:3a:dd:aa:42:8b
NODE_BRIDGE=""
NODE_ROLE=bench-device
NODE_OS=any
NODE_LOCAL=""
NODE_VOLUME=""
NODE_DTB=bcm2711-rpi-4-b.dtb
NODE_BENCH_SSH=rpi4-bench
NODE_NET=wifi
NODE_NOTE="Raspberry Pi 4 (4 GB), on the house LAN. Bench system on the USB drive (tried first); rescue on the SD card."
