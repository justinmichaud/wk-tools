# rpi4 -- Raspberry Pi 4B (4 GB), behind tailnet-bridge-generic.
#
# Two media, two jobs. The bench system's root lives on the USB drive
# (NODE_DEVICE); the rescue on the SD card (NODE_ROOT is its root partition).
# The bootloader refuses to USB-MSD-boot the drive there today (an Emtec
# stick: armed, complete files, enumerates in 1.5 s under Linux -- skipped on
# either bus, warm or cold; the stick is a placeholder for a fast SSD), so
# the boot is split: the firmware loads the bench kernel from the SD via a
# tryboot one-shot and the kernel mounts the drive by PARTUUID
# (boot/pi-tryboot.sh). The drive is still the measured medium.

# The rescue's tailnet name; the bench system joins as NODE_BENCH_SSH. Two
# systems wk wrote, two nodes: one name for both would make the second card's
# write collide with the first's node. No env override: renaming a fleet
# device is done by editing this conf.
NODE_SSH="rpi4-rescue"
NODE_DRIVER=pi-tryboot
NODE_DEVICE=/dev/sda
NODE_ROOT=/dev/mmcblk0p2
# The bench system this board is measured on. Its firmware settings are in
# image/webkit-2.52-yocto-rpi4-64/config.txt.append.
NODE_PROFILE=webkit-2.52-yocto-rpi4-64
# The wired NIC's hardware address -- the one fact this board keeps across
# every image it boots, so it is what a sweep looks for when the tailnet
# cannot name the board (reach_enumerate, lib/reach.sh).
NODE_MAC=d8:3a:dd:aa:42:8a
# On the cable behind this bridge, which is also why NODE_MAC above is a
# reservation there: when the bridge's adapter is absent every board on the
# cable goes quiet at once and none of them is at fault.
# A dedicated bench device licenses the permanent BOOT_ORDER (cmd/pi reads this field).
NODE_ROLE=bench-device
NODE_OS=any
NODE_LOCAL=""
NODE_VOLUME=""
# The device tree this board's firmware asks for (image_dtb_for, lib/image.sh).
NODE_DTB=bcm2711-rpi-4-b.dtb
# What a *bench* system written for this board joins the tailnet as.
NODE_BENCH_SSH=rpi4-bench
# No cable at the bench: its rescue/bench images bring up WiFi from a
# credential seeded onto the card (_image_wants_wifi, boot/disk.sh).
NODE_NET=wifi
NODE_NOTE="Raspberry Pi 4 (4 GB), behind tailnet-bridge-generic. Bench system on the USB drive (tried first); rescue on the SD card."
