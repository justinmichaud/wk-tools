# rpi4 -- Raspberry Pi 4B (4 GB), behind tailnet-bridge-generic.
#
# Two media, two jobs: this board is usb-first, so the stick (MACH_DEVICE)
# holds the rescue -- a board nobody has touched is a board that answers --
# and the bench system goes on the SD (MACH_ROOT). `wk status` composes the
# reprovisioning steps per lane from the fields below (b_reprovision,
# boot/pi-usb.sh); see docs/HANDOFF-boot.md for open work.

# The tailnet name and nothing else -- it carries tailscale and joins on
# first boot, so it resolves through MagicDNS (CLAUDE.md, "a node is reached
# by its tailnet name").
MACH_SSH="${WK_RPI4_SSH:-rpi4}"
# pi-usb: the bench lane is local media, fleet-wide -- a local root keeps the
# network out of the measurement.
MACH_DRIVER=pi-usb
MACH_DEVICE=/dev/sda
MACH_ROOT=/dev/mmcblk0p2
# The bench system this board is measured on. Its firmware settings are in
# image/webkit-2.52-yocto-rpi4-64/config.txt.append.
MACH_PROFILE=webkit-2.52-yocto-rpi4-64
# The wired NIC's hardware address -- the one fact this board keeps across
# every image it boots, so it is what a sweep looks for when the tailnet
# cannot name the board (reach_enumerate, lib/reach.sh).
MACH_MAC=d8:3a:dd:aa:42:8a
# On the cable behind this bridge, which is also why MACH_MAC above is a
# reservation there: when the bridge's adapter is absent every board on the
# cable goes quiet at once and none of them is at fault.
MACH_BRIDGE=tailnet-bridge-generic
# A dedicated bench device licenses the permanent usb-first BOOT_ORDER
# (cmd/pi reads this field).
MACH_ROLE=bench-device
MACH_OS=any
MACH_LOCAL=""
MACH_VOLUME=""
# The device tree this board's firmware asks for (image_dtb_for, lib/image.sh).
MACH_DTB=bcm2711-rpi-4-b.dtb
MACH_BENCH_SSH=""
# No cable at the bench: its rescue/bench images bring up WiFi from a
# credential seeded onto the card (_image_wants_wifi, boot/disk.sh).
MACH_NET=wifi
MACH_NOTE="Raspberry Pi 4 (4 GB), behind tailnet-bridge-generic. Rescue on the USB stick (usb-first); bench system on the SD."
