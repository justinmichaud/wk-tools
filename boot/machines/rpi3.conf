# rpi3 -- Raspberry Pi 3, armv7l, 931 MB. Local SD media.
#
# Provisioned 2026-08-22: its SD card holds
# downstream-yocto-wpe-2.48-rpi3-32-20260822T205734Z (built on moose, in moose's
# image store), written from the rpi5's reader. It answers as
# raspberrypi3.local when it is powered on.
#
# **That image is this board's base image, and a base image is never
# benchmarked.** It is the only system on the board, so there is nothing here a
# benchmark could legitimately run against: `b_system_kind` (boot/machines.sh)
# answers `base` for any root on the SD, and `wk pi bench rpi3` refuses. That
# refusal is the point rather than a gap -- the base image's job is to keep the
# board reachable and to let another system be written and recovered, and a
# number taken from the helper is a number from the wrong system that looks
# exactly like a real one afterwards.
#
# It should also be a *rescue-role* image (IMG_ROLE=rescue), and today it is not
# -- it was built from a bench profile, so it carries a self-return watchdog
# that reboots the helper every 15 minutes. Same open item as the rpi4's SD.
#
# What that costs, plainly: this board cannot be measured until it has a second
# system on that card. The arrangement -- SD only, rescue and bench sharing the
# card, armed in stage 2 -- and the reasoning that forces it are in
# `wk help hardware`, "why the three Pis are arranged differently"; the work left
# is in docs/HANDOFF-boot.md. Design goes in the help text, not here and not in a
# handoff.
#
# From nothing, as of 2026-08-24 -- one card write, and everything after it is
# remote:
#
#   wk sysimage write --from vm:<the image the workspace built> \
#                     --disk rpi5:/dev/mmcblk0 --profile wpe-2.38-rpi3 --rescue
#
# then move the card and power on. No `--grow`: the root partition stays at its
# built size so the rest of the card is free for the bench system this board
# will install into it *itself*, over the network, with nobody in the room.
# That is the whole point of the write leaving room (wk help hardware).
#
# The image is whatever a workspace built and is not in any store (wk help
# images) -- `vm:` reads it out of this machine's podman VM, which is where a
# container workspace leaves its output and which a macOS driver cannot open
# directly.
# `hands-on` today because nothing here can arm this board yet, not because it
# cannot be armed: the stage-2 arming this arrangement calls for is unwritten
# (docs/HANDOFF-boot.md). The USB-boot OTP fuse is reported already blown and
# governs stage 1, which this design does not use.

MACH_SSH="${WK_RPI3_SSH:-rpi3}"
MACH_DRIVER=pi-sd
# One medium, holding both systems: the rescue on MACH_ROOT below and the bench
# system in a second root on the same card. Not a limitation -- this board's
# Ethernet is a USB device, so a bench root on a stick would share a bus with the
# traffic the benchmark generates (`wk help hardware`).
MACH_DEVICE=/dev/mmcblk0
MACH_ROOT=/dev/mmcblk0p2
# The wired NIC's address, read off the board 2026-08-22 once it was up. Worth
# declaring for the reason the rpi4's is: it is the one fact the board keeps
# across every image it boots, so it is what finds a *bench* system, which
# carries no tailscale and answers only on the LAN (image_addr, boot/machines.sh).
#
# It is doing that job harder here than on the rpi4. This board is on the house
# LAN with no reservation available, and it was observed holding **two leases at
# once on one interface** -- 192.168.1.169 and .171, both live on eth0 -- which
# is the same firmware-and-kernel-present-different-client-identifiers behaviour
# the rpi4 conf describes, and exactly why no address is written down here.
# image_addr prefers a REACHABLE neighbour entry over a stale one for this MAC,
# which is what picks between them.
MACH_MAC=b8:27:eb:9a:07:29
# Yocto, not perf-linux: `perf-linux-*` systems are seeded from Ubuntu's
# preinstalled raspi image and Ubuntu 26.04 publishes no armhf one, so
# image/profiles.sh refuses `perf-linux-rpi3` by name -- "there is no
# perf-linux-rpi3, and there will not be one". This field named it anyway,
# which made the fleet's only 32-bit board point at a system that cannot be
# built: `wk boot rpi3 --system` had no default to resolve and image_addr fell
# back to the wrong `.local` name. -32 rather than -64 because armv7l is this
# board's native width, and 32 is the only width it has here: the 64-bit rpi3
# system is gone (2026-08-25) -- the board is treated as 32-bit only, so there is
# no marginal 931 MB comparison to keep a profile for.
#
# Renamed with the rest on 2026-08-25. The system currently on the card was built
# from what is now called webkit-2.52-yocto-rpi3-32's predecessor, and the
# release moved with the rename: WebKit's release branch here is 2.52, and
# webkitglib/2.48 -- which the old name called `downstream` -- was never a
# WPEWebKit branch at all.
MACH_PROFILE=webkit-2.52-yocto-rpi3-32
# No MACH_BRIDGE, and the omission is the fact worth recording. This board is
# cabled to the house LAN directly, not onto the phone's segment -- confirmed
# 2026-08-22 by the person holding it. The bridge's own conf still describes
# 10.99.1.0/24 as "the rpi3/rpi4 cable" and says the segment "holds two boards
# today"; only the rpi4 has ever appeared on it, and a sweep of every address
# in the pool found nothing else at layer 2. So that prose is the stale half,
# not this line -- reaching this board needs no jump host.
# bench-device, and that is what it is *for* -- it is not a workstation and
# nothing on it is precious. It is not the same claim as "there is a bench
# system on it right now": that question is answered by which medium the running
# root is on, never by this field.
MACH_ROLE=bench-device
MACH_OS=any
MACH_NOTE="Raspberry Pi 3 (armv7l, 931 MB), on the house LAN. Boots its SD card; card swaps are hands-on."
