# rpi3 -- Raspberry Pi 3 (armv7l, 931 MB), on the house LAN.
#
# Boots its SD card; card swaps are hands-on. See `wk help` for why
# the three Pis are arranged differently, and docs/HANDOFF-boot.md for the
# stage-2 arming this board still needs.

# Every system on this board is one wk wrote, so its host mode answers by
# the bench name too. No env override: renaming a fleet device is done by
# editing this conf, not by an environment variable nothing sets.
MACH_SSH="rpi3-bench"
MACH_DRIVER=pi-sd
# One medium holds both rescue and bench system: this board's Ethernet is a
# USB device, so a bench root on a stick would share a bus with the traffic
# the benchmark generates (`wk help`).
MACH_DEVICE=/dev/mmcblk0
MACH_ROOT=/dev/mmcblk0p2
# The wired NIC's address, read off the board once it is up -- the one fact
# it keeps across every image it boots, so it is what finds a *bench* system
# (image_addr, boot/machines.sh). This board has been observed holding two
# DHCP leases at once on one interface, which is why no address is written
# down here; image_addr prefers a REACHABLE neighbour entry over a stale one.
MACH_MAC=b8:27:eb:9a:07:29
MACH_BRIDGE=""
MACH_ROLE=bench-device
MACH_OS=any
MACH_LOCAL=""
MACH_VOLUME=""
# 32-bit: armv7l is this board's native width and the only one it has here.
MACH_PROFILE=webkit-2.52-yocto-rpi3-32
# The device tree this board's firmware asks for (image_dtb_for, lib/image.sh).
MACH_DTB=bcm2710-rpi-3-b.dtb
MACH_BENCH_SSH=rpi3-bench
# No cable at the bench: its rescue/bench images bring up WiFi from a
# credential seeded onto the card (_image_wants_wifi, boot/disk.sh).
MACH_NET=wifi
MACH_NOTE="Raspberry Pi 3 (armv7l, 931 MB), on the house LAN. Boots its SD card; card swaps are hands-on."
