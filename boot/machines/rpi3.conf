# rpi3 -- Raspberry Pi 3, armv7l, 931 MB. Local SD media; not provisioned.
#
# From nothing: `wk sysimage build downstream-yocto-wpe-2.48-rpi3-32` (or
# -64), write it to the SD card, `wk pi setup` once it answers. Local SD is
# the whole lane (netboot is gone, and USB/network boot would burn a one-way
# OTP bit for a capability nothing needs -- the door stays shut). The driver
# is a hands-on stub until the board is provisioned.

MACH_SSH="${WK_RPI3_SSH:-rpi3}"
MACH_DRIVER=pi-sd
MACH_DEVICE=/dev/mmcblk0
MACH_ROOT=/dev/mmcblk0p2
MACH_PROFILE=perf-linux-rpi3
MACH_ROLE=bench-device
MACH_OS=any
MACH_NOTE="Raspberry Pi 3. Local SD media, hands-on; not provisioned yet."
