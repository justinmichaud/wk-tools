# rpi3 -- Raspberry Pi 3 (armv7l, 931 MB), on the house LAN.
#
# One SD card holds both systems: the rescue on partitions 1-2, the bench
# system on 3-4 (`@second`), selected for one boot by boot/pi-sd.sh. See
# `wk help` for why the three Pis are arranged differently.

# Two systems, two tailnet names: the rescue (this board's host mode) joins
# as rpi3-rescue, the bench system as NODE_BENCH_SSH. Both are systems wk
# wrote, and each joins the tailnet as its own node, so one name for both
# would make the second card's write collide with the first's node. No env
# override: renaming a fleet device is done by editing this conf.
NODE_SSH="rpi3-rescue"
NODE_DRIVER=pi-sd
# One medium holds both rescue and bench system: this board's Ethernet is a
# USB device, so a bench root on a stick would share a bus with the traffic
# the benchmark generates (`wk help`).
NODE_DEVICE=/dev/mmcblk0
NODE_ROOT=/dev/mmcblk0p2
# The wired NIC's address, read off the board once it is up -- the one fact
# it keeps across every image it boots, so it is what finds a *bench* system
# (image_addr, boot/machines.sh). This board has been observed holding two
# DHCP leases at once on one interface, which is why no address is written
# down here; image_addr prefers a REACHABLE neighbour entry over a stale one.
NODE_MAC=b8:27:eb:9a:07:29
NODE_BRIDGE=""
NODE_ROLE=bench-device
NODE_OS=any
NODE_LOCAL=""
NODE_VOLUME=""
# 32-bit: armv7l is this board's native width and the only one it has here.
NODE_PROFILE=webkit-2.52-yocto-rpi3-32
# The device tree this board's firmware asks for (image_dtb_for, lib/image.sh).
NODE_DTB=bcm2710-rpi-3-b.dtb
# What a *bench* system written for this board joins the tailnet as.
NODE_BENCH_SSH=rpi3-bench
# No cable at the bench: its rescue/bench images bring up WiFi from a
# credential seeded onto the card (_image_wants_wifi, boot/disk.sh).
NODE_NET=wifi
NODE_NOTE="Raspberry Pi 3 (armv7l, 931 MB), on the house LAN. One SD card: rescue on p1-p2, bench system on p3-p4."
