# mbp -- this Mac (tolken). Boots a benchmark volume; the selection is
# hands-on (Apple Silicon).
#
# From nothing: macOS install + ./setup; the bench volume is a second macOS
# install personalised for this Mac by hand -- docs/HANDOFF-mac-perf-mode.md
# is the runbook, and no image can produce it (Apple Silicon boot policy
# lives in the machine's own secure storage).

# The machine this driver runs on, and the only one in the fleet that cannot
# be driven from anywhere else: there is one Apple Silicon machine here, so
# its transition is arranged from inside the mode it is leaving. See
# boot/mac-volume.sh for what that costs.
MACH_LOCAL=1
MACH_SSH=localhost
MACH_DRIVER=mac-volume
# Not a block device: what is booted is an *installed volume*. MACH_DEVICE is
# left empty so that anything reaching for it fails loudly rather than
# writing to a disk on a machine that has no image to write.
MACH_DEVICE=""
MACH_ROOT=""
MACH_VOLUME="${WK_BENCH_VOLUME:-WK Bench}"
MACH_PROFILE=perf-macos-tolken
MACH_ROLE=workstation
# macOS-only: a MACH_LOCAL machine answers only for itself, so driving it
# from a Linux host would probe the wrong computer (`wk boot` refuses).
MACH_OS=macos
MACH_NOTE="This Mac. Boots a benchmark volume; the selection is hands-on (Apple Silicon)."
