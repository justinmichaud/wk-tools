# mbp -- this Mac. Boots a benchmark volume; the selection is hands-on
# (Apple Silicon boot policy has no remote API).
#
# From nothing: macOS install + ./setup, then a second macOS install
# personalised for this Mac by hand (docs/HANDOFF-mac-perf-mode.md is the
# runbook; no image can produce it -- the boot policy lives in this
# machine's own secure storage).

# The tailnet name -- resolves through MagicDNS from anywhere on the tailnet
# (CLAUDE.md, "a node is reached by its tailnet name"). Not "localhost": this
# is also the address a *driver on another machine* reaches this Mac's host
# mode at (bench/mac-lane.sh, bench/mac-ab.sh), since neither can run on the
# Mac they measure. No env override: renaming a fleet device is done by
# editing this conf, not by an environment variable nothing sets.
MACH_SSH="tolken"
MACH_DRIVER=mac-volume
# Not a block device: what is booted is an *installed volume*. Left empty so
# anything reaching for it fails loudly rather than writing to a disk with no
# image to write.
MACH_DEVICE=""
MACH_ROOT=""
MACH_PROFILE=perf-macos-tolken
MACH_MAC=""
MACH_BRIDGE=""
MACH_ROLE=workstation
# macOS-only: a MACH_LOCAL machine answers only for itself, so driving it
# from a Linux host would probe the wrong computer (`wk boot` refuses).
MACH_OS=macos
MACH_LOCAL=1
# WK_BENCH_VOLUME overrides the volume name: tests/test_quick.py points it
# at a name nothing mounts, to test `wk boot mbp --status` against a bench
# volume that is genuinely absent, without touching a real one.
MACH_VOLUME="${WK_BENCH_VOLUME:-WK Bench}"
# No board firmware to ask: a Mac boots a signed volume, not a device tree.
MACH_DTB=""
# Same address as MACH_SSH, a different ssh config stanza (dotfiles/ssh/config)
# so the two installs' host keys never collide in one known_hosts. No env
# override, matching MACH_SSH above: edit this conf to rename the device.
MACH_BENCH_SSH="tolken-bench"
# Has a cable: no card is ever seeded with WiFi credentials for this machine.
MACH_NET=ethernet
MACH_NOTE="This Mac. Boots a benchmark volume; the selection is hands-on (Apple Silicon)."
