# mbp -- this Mac. NODE_BENCH_SSH is a second ssh stanza (dotfiles/ssh/config) at the same address, so the two installs' host keys never collide.

NODE_SSH="tolken"
NODE_DRIVER=mac-volume
NODE_DEVICE=""
NODE_ROOT=""
NODE_PROFILE=perf-macos-tolken
NODE_MAC=""
NODE_BRIDGE=""
NODE_ROLE=workstation
NODE_OS=macos
NODE_VOLUME="${WK_BENCH_VOLUME:-WK Bench}"
NODE_DISPLAY="builtin 1280x832"   # the mode the bench install is held at, in points: 1280x832 at scale 2 is exactly the 2560x1664 panel, so no frame is downsampled. The autorun writes it and reboots if the install comes up at another.
NODE_DTB=""
NODE_BENCH_SSH="tolken-bench"
NODE_NET=wifi
NODE_NOTE="This Mac. Boots a benchmark volume; the selection is a command, signed with a volume owner's credential."
