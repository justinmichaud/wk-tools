# mbp -- this Mac. NODE_BENCH_SSH is a second ssh stanza (dotfiles/ssh/config) at the same address, so the two installs' host keys never collide.

NODE_SSH="tolken"
NODE_DRIVER=mac-volume
NODE_DEVICE=""
NODE_ROOT=""
NODE_PROFILE=perf-macos-tolken
NODE_MAC=""
NODE_BRIDGE=""
NODE_ROLE=workstation
NODE_OS=macos
NODE_LOCAL=1
NODE_VOLUME="${WK_BENCH_VOLUME:-WK Bench}"
NODE_DTB=""
NODE_BENCH_SSH="tolken-bench"
NODE_NET=ethernet
NODE_NOTE="This Mac. Boots a benchmark volume; the selection is hands-on (Apple Silicon)."
