# rpi5 -- Raspberry Pi 5, WiFi only. USB one-shot; the NVMe workstation is
# untouched.
#
# From nothing: flash Ubuntu server to the NVMe, run this repo's ./setup plus
# host/linux/rpi5/rpi5-setup.sh (needs the gitignored rpi5.conf for the WiFi
# identity -- rpi5.conf.example documents it), then
# `wk sysimage build webkit-2.52-yocto-rpi5-64` + `wk sysimage write` for the
# stick.

MACH_SSH=rpi5
# The board has no cable, and its `tryboot` is already taken by
# flash-kernel's kernel staging -- USB is the option that does not fight the
# existing configuration.
MACH_DRIVER=rpi5-usb
MACH_DEVICE=/dev/sda
MACH_ROOT=/dev/nvme0n1p2
# The bench system this board is measured on. Its firmware settings are in
# image/webkit-2.52-yocto-rpi5-64/config.txt.append.
MACH_PROFILE=webkit-2.52-yocto-rpi5-64
# The radio's own address: this board boots the same hardware for both host
# and bench mode, so it presents the same MAC and the AP hands it the same
# lease -- "where is the system" is answered from the driving machine's
# neighbour table rather than from anything stored.
MACH_MAC=88:a2:9e:07:1c:92
MACH_BRIDGE=""
MACH_ROLE=workstation
MACH_OS=any
MACH_LOCAL=""
MACH_VOLUME=""
# The device tree this board's firmware asks for (image_dtb_for, lib/image.sh).
MACH_DTB=bcm2712-rpi-5-b.dtb
# The workstation keeps its own name; the stick joins as this.
MACH_BENCH_SSH=rpi5-bench
# No cable at all on this board: its rescue/bench images bring up WiFi from
# a credential seeded onto the card (_image_wants_wifi, boot/disk.sh).
MACH_NET=wifi
MACH_NOTE="Raspberry Pi 5, WiFi only. USB one-shot; the NVMe workstation is untouched."
