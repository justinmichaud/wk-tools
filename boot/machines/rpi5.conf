# rpi5 -- Raspberry Pi 5, WiFi only. USB one-shot; the NVMe workstation is
# untouched.
#
# From nothing: flash Ubuntu server to the NVMe, run this repo's ./setup plus
# host/linux/rpi5/rpi5-setup.sh (stability half; needs the gitignored
# rpi5.conf for the WiFi identity -- rpi5.conf.example documents it), then
# `wk sysimage build webkit-2.52-yocto-rpi5-64` + `wk sysimage write` for the
# stick.

MACH_SSH=rpi5
# The board has no cable, and its `tryboot` is already taken by flash-kernel's
# kernel staging -- so USB is also the option that does not fight the existing
# configuration.
MACH_DRIVER=rpi5-usb
MACH_DEVICE=/dev/sda
MACH_ROOT=/dev/nvme0n1p2
# The bench system this board is measured on. Its firmware settings are in
# image/webkit-2.52-yocto-rpi5-64/config.txt.append.
MACH_PROFILE=webkit-2.52-yocto-rpi5-64
# The radio's own address, and the reason the bench system is findable at
# all: it boots the same hardware, so it presents the same MAC and the AP
# hands it the same lease -- "where is the system" is answered from the
# driving machine's neighbour table rather than from anything stored.
# Declared hardware identity, like MACH_DEVICE.
MACH_MAC=88:a2:9e:07:1c:92
MACH_ROLE=workstation
MACH_OS=any
MACH_NOTE="Raspberry Pi 5, WiFi only. USB one-shot; the NVMe workstation is untouched."
