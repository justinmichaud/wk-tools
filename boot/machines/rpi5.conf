# rpi5 -- D0 silicon (16 GB Pi 5, revision e04171): the firmware asks for the stepping's device tree, and the plain bcm2712 one panics in bcm2712_pull_config_set before rootfs.

NODE_SSH=rpi5
NODE_DRIVER=rpi5-usb
NODE_DEVICE=/dev/sda
NODE_ROOT=/dev/nvme0n1p2
NODE_PROFILE=webkit-2.52-yocto-rpi5-64
NODE_MAC=88:a2:9e:07:1c:92
NODE_BRIDGE=""
NODE_ROLE=workstation
NODE_OS=any
NODE_LOCAL=""
NODE_VOLUME=""
NODE_DTB=bcm2712-rpi-5-b.dtb
NODE_BENCH_SSH=rpi5-bench
NODE_NET=wifi
NODE_NOTE="Raspberry Pi 5, WiFi only. USB one-shot; the NVMe workstation is untouched."
