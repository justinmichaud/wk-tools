# benchvm -- a macOS guest standing in for a benchmark install.
#
# Rehearses the path, never the number. From nothing: `wk vm base` builds the
# golden guest this clones from (boot/mac-guest.sh); the guest is disposable
# by construction.

NODE_SSH=""
NODE_DRIVER=mac-guest
NODE_DEVICE=""
NODE_ROOT=""
NODE_PROFILE=perf-macos-benchvm
NODE_MAC=""
NODE_BRIDGE=""
NODE_ROLE=bench-device
# tart exists only on the macOS host.
NODE_OS=macos
NODE_LOCAL=""
NODE_VOLUME=""
# No board firmware to ask: a Tart guest boots a virtual disk, not a device tree.
NODE_DTB=""
# Reached through the host (`wk enter`), not by a second ssh alias.
NODE_BENCH_SSH=""
# A Tart guest shares the host's network, not a card seeded with WiFi
# credentials.
NODE_NET=ethernet
NODE_NOTE="A macOS guest standing in for a benchmark install. Rehearses the path, not the number."
