# benchvm -- a macOS guest standing in for a benchmark install. Rehearses the
# path, never the number.
#
# From nothing: `wk vm base` builds the golden guest this clones from; the
# guest itself is disposable by construction.

# A guest, so everything about it is scriptable -- which is what makes it the
# rehearsal for the MBP rather than a replacement for it. See
# boot/mac-guest.sh for what it can and cannot prove.
MACH_LOCAL=""
MACH_SSH=""            # the driver reaches the guest itself
MACH_DRIVER=mac-guest
MACH_DEVICE=""
MACH_ROOT=""
MACH_VOLUME=""
MACH_PROFILE=perf-macos-benchvm
MACH_ROLE=bench-device
# Needs tart, which exists only on the macOS host.
MACH_OS=macos
MACH_NOTE="A macOS guest standing in for a benchmark install. Rehearses the path, not the number."
