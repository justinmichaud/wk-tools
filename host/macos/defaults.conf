NSGlobalDomain AppleInterfaceStyle string Dark the person's choice: dark appearance

NSGlobalDomain AppleShowAllExtensions bool true the person's choice: Finder shows every file extension

NSGlobalDomain AppleKeyboardUIMode int 2 the person's choice: Tab reaches every control

NSGlobalDomain NSAutomaticSpellingCorrectionEnabled bool false typed code and commands must not be rewritten
NSGlobalDomain NSAutomaticCapitalizationEnabled bool false typed code and commands must not be rewritten
NSGlobalDomain NSAutomaticDashSubstitutionEnabled bool false `--` in a typed flag must stay two hyphens
NSGlobalDomain NSAutomaticQuoteSubstitutionEnabled bool false typed quotes must stay ASCII for shells and code
NSGlobalDomain NSAutomaticPeriodSubstitutionEnabled bool false typed code and commands must not be rewritten

NSGlobalDomain com.apple.mouse.scaling float 0.5 the person's choice: pointer speed

NSGlobalDomain AppleICUForce24HourTime bool true the person's choice: 24-hour clock

NSGlobalDomain AppleWindowTabbingMode string always the person's choice: new windows open as tabs

com.apple.dock show-recents bool false the person's choice: no recent apps in the Dock
com.apple.dock mru-spaces bool false Spaces keep their order instead of rearranging by use

# wvous corner values: 1 = do nothing, 2 = Mission Control.
com.apple.dock wvous-br-corner int 1 the person's choice: no bottom-right hot corner
com.apple.dock wvous-tl-corner int 2 the person's choice: top-left hot corner opens Mission Control

com.apple.screensaver askForPassword int 0 the person's choice: no password on waking the screen saver

com.apple.Safari IncludeDevelopMenu bool true WebKit work inspects pages from Safari's Develop menu
com.apple.Safari WebKitDeveloperExtrasEnabledPreferenceKey bool true WebKit work needs Web Inspector in every page
