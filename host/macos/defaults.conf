# macOS defaults applied by ./setup and regenerated by `wk backup`.
#
# Format:  <domain> <key> <type> <value...>
#   type is one of: string bool int float
#   value is the rest of the line
#
# Only settings that are deliberate choices belong here. Anything macOS manages
# on its own (window positions, recent items, per-app state) is noise and makes
# the file unrestorable, so `wk backup` will not add it.
#
# Keyboard shortcuts are not here -- they live as a whole domain in
# symbolichotkeys.plist, because AppleSymbolicHotKeys is a nested dictionary
# that cannot be expressed as scalar key/value pairs.
#
# Every entry below already carries its own why in the comment above it --
# this file's summary of what is persisted and why is the file itself.
# `wk backup --candidates` surfaces live, non-default settings not yet listed
# here, for a maintainer to add by hand after deciding they're deliberate.

# Appearance
NSGlobalDomain AppleInterfaceStyle string Dark

# Finder / file handling
NSGlobalDomain AppleShowAllExtensions bool true

# Full keyboard access: Tab moves between all controls, not just text fields.
NSGlobalDomain AppleKeyboardUIMode int 2

# Text substitution off across the board. These corrupt code and commit
# messages, which is why all five are disabled rather than just autocorrect.
NSGlobalDomain NSAutomaticSpellingCorrectionEnabled bool false
NSGlobalDomain NSAutomaticCapitalizationEnabled bool false
NSGlobalDomain NSAutomaticDashSubstitutionEnabled bool false
NSGlobalDomain NSAutomaticQuoteSubstitutionEnabled bool false
NSGlobalDomain NSAutomaticPeriodSubstitutionEnabled bool false

# Pointer
NSGlobalDomain com.apple.mouse.scaling float 0.5

# 24-hour clock
NSGlobalDomain AppleICUForce24HourTime bool true

# Window tabbing: a new document opens as a tab in the existing window rather
# than a new window, everywhere the app leaves the choice to the system.
NSGlobalDomain AppleWindowTabbingMode string always

# Dock. show-recents off (the recent-applications section is noise beside a
# pinned Dock); mru-spaces off so Mission Control leaves the spaces in the
# order they were created rather than reordering them under the cursor.
com.apple.dock show-recents bool false
com.apple.dock mru-spaces bool false

# Hot corners. 1 is "do nothing" and 2 is Mission Control, so: the bottom-right
# corner does nothing (it is Quick Note by default, and it fires while reaching
# for a scrollbar) and the top-left is Mission Control.
com.apple.dock wvous-br-corner int 1
com.apple.dock wvous-tl-corner int 2

# No password after the screen saver or sleep. This machine's disk is
# encrypted and it is not left unattended in public; a lock screen between a
# benchmark and its operator costs more than it protects.
com.apple.screensaver askForPassword int 0

# Safari's Develop menu, and the Web Inspector it enables.
com.apple.Safari IncludeDevelopMenu bool true
com.apple.Safari WebKitDeveloperExtrasEnabledPreferenceKey bool true
