---
# Provisioning for the wk podman machine, run by podman after first boot.
#
# Scope is deliberately narrow: only OS-level state that has no dependency on
# wk-tools itself. The repo is not copied in at all -- the machine mounts this
# checkout read-only at /opt/wk-tools (host/macos/machine.sh), so the VM runs
# the working tree and nothing has to be pushed to GitHub to be testable --
# and what needs the repo (the egress proxy, the SDK) is installed around that
# mount afterwards by host/macos/vmtools.sh.
#
# Nothing here touches /opt/wk-tools or {{ wk_root }}/secrets: both are mounts,
# and a task that chowns or creates one either fails against a read-only
# filesystem or writes into this host's own directories.
#
# Recovering from `podman machine rm` is still one `./setup`.

- name: Provision the wk podman machine
  hosts: localhost
  become: true
  vars:
    wk_root: /var/lib/wk

  tasks:
    - name: Create the workspace storage tree
      # Every directory here is on the VM's native filesystem, and none of them
      # is one of the machine's three host mounts. Hardlinks between base
      # snapshots only work within one filesystem, and compiling over virtiofs
      # would dominate build time -- so nothing a build touches may be a mount.
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: core
        group: core
        mode: "0755"
      loop:
        - "{{ wk_root }}"
        - "{{ wk_root }}/git"
        - "{{ wk_root }}/base"
        - "{{ wk_root }}/ws"
        - "{{ wk_root }}/cache/ccache"
        - "{{ wk_root }}/cache/yocto/downloads"
        - "{{ wk_root }}/cache/yocto/sstate"
        - "{{ wk_root }}/cache/buildroot/dl"
        - "{{ wk_root }}/cache/buildroot/ccache"
        - "{{ wk_root }}/tools"

    - name: Create the Pi allowlist file
      # Read back by ./setup when it regenerates the firewall, so the test
      # devices survive a policy rebuild. Empty is the correct initial state.
      ansible.builtin.file:
        path: "{{ wk_root }}/pi-hosts"
        state: touch
        owner: core
        group: core
        mode: "0644"
        modification_time: preserve
        access_time: preserve

    - name: Mark this machine as headless
      # Read by lib/resources.sh. The VM has no desktop to protect, and the
      # macOS host already subtracted its own reserve when sizing the VM;
      # applying the desktop reserve again here would leave containers with a
      # fraction of the memory that is actually free.
      ansible.builtin.file:
        # The one marker `headless_marker` (lib/resources.sh) reads.
        path: "{{ wk_root }}/.headless"
        state: touch
        owner: core
        group: core
        mode: "0644"
        modification_time: preserve
        access_time: preserve

    - name: Layer the two packages the base image lacks
      # The machine image is Fedora CoreOS: an ostree-based immutable OS, so
      # there is no dnf and packages are layered with rpm-ostree. Layering
      # mutates the base OS, so keep it to what is genuinely missing.
      #
      # Only these two are absent from the base image. nftables, jq and rsync
      # are already there -- asking for them made rpm-ostree resolve
      # dependencies on every run for no reason.
      #
      #   git      the WebKit mirror and the base snapshots live in the VM and
      #            are maintained by `wk sync`, so git has to run here.
      #   python3  the SDK patcher (container/sdk-patches/apply.sh) uses it for
      #            exact-match and regex edits; doing that in sed would be far
      #            more fragile against an SDK that moves under us.
      #
      # --apply-live avoids a reboot; --idempotent makes a re-run free.
      ansible.builtin.command:
        cmd: rpm-ostree install --idempotent --apply-live --allow-inactive git python3
      register: pkgs
      # rpm-ostree prints "No change." when everything is already layered. The
      # previous condition tested for a string it never emits, so this task
      # reported changed on every run and made ./setup look like it had done
      # work when it had not.
      changed_when: "'No change.' not in pkgs.stdout"
      failed_when:
        - pkgs.rc != 0
        - "'already requested' not in (pkgs.stderr | default(''))"

    - name: Layer Tailscale
      # Runs on the VM, not inside a workspace. That is deliberate: a workspace
      # then needs no TUN device and no CAP_NET_ADMIN, and `ssh rpi5` works
      # normally instead of through a SOCKS proxy.
      #
      # It is the only way a workspace reaches the Pi test devices, since the
      # egress policy drops all RFC1918 and the Pis sit on an isolated network.
      ansible.builtin.command:
        cmd: rpm-ostree install --idempotent --apply-live --allow-inactive tailscale
      register: ts
      changed_when: "'No change.' not in ts.stdout"
      failed_when: ts.rc != 0 and 'No change.' not in ts.stdout

    - name: Enable tailscaled
      # `tailscale up --advertise-tags=tag:wk` is deliberately NOT done here: it
      # needs an auth key, which must not live in this repo. `wk pi setup` does
      # it, and records the resulting Pi addresses in /var/lib/wk/pi-hosts so
      # the firewall can allow them.
      ansible.builtin.systemd_service:
        name: tailscaled
        enabled: true
        state: started
      failed_when: false
